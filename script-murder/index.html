<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#1a1512">
<title>剧本杀 · 联机局</title>
<style>
:root{
  --bg:#14100e; --bg2:#1c1714; --panel:#221b18; --panel2:#2a211d;
  --line:#3d2f28; --line2:#4d3a30;
  --text:#f2e9df; --muted:#a9988a; --dim:#7d6d61;
  --gold:#c9a227; --gold2:#e8c95a; --red:#a83232; --red2:#d14848;
  --green:#4a8a5a; --shadow:0 8px 32px rgba(0,0,0,.4);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
body{min-height:100vh;background-image:radial-gradient(ellipse at 20% 0%,#2a1a12 0%,transparent 55%),
  radial-gradient(ellipse at 90% 100%,#1f1418 0%,transparent 50%)}
button,input,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
input,textarea{outline:none}
.hidden{display:none !important}

#app{max-width:560px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:40px}

/* 顶部 */
#topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;
  height:54px;padding:0 16px;background:rgba(20,16,14,.94);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px}
.brand-mark{width:28px;height:28px;border:1px solid var(--gold);color:var(--gold2);
  display:flex;align-items:center;justify-content:center;font-size:15px;border-radius:4px;
  font-family:serif}
.brand-text{font-size:14px;letter-spacing:1px;color:var(--muted)}
.top-actions{display:flex;align-items:center;gap:10px}
.code-chip{font-size:12px;color:var(--gold2);border:1px solid var(--line2);padding:3px 9px;border-radius:20px;letter-spacing:2px}
.icon-btn{width:30px;height:30px;border-radius:50%;background:var(--panel);color:var(--muted);font-size:14px}
.icon-btn:hover{color:var(--text)}

/* 页面 */
.page{display:none;padding:20px 18px;animation:fade .25s ease}
.page.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* 首页 */
.hero{text-align:center;padding:40px 0 34px;position:relative}
.hero-deco{font-size:30px;color:var(--gold);opacity:.7;margin-bottom:8px}
.hero h1{font-size:27px;margin:0 0 8px;font-weight:600;letter-spacing:2px;
  background:linear-gradient(180deg,#f7e6b8,#c9a227);-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent}
.hero-sub{color:var(--muted);font-size:13px;margin:0}
.home-cards{display:flex;flex-direction:column;gap:12px}
.big-card{display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 16px;
  transition:.18s}
.big-card:active,.big-card:hover{background:var(--panel2);border-color:var(--gold)}
.card-icon{width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#8a6a1e,#c9a227);color:#1a1512;border-radius:10px;font-size:24px;font-weight:bold}
.card-icon.alt{background:linear-gradient(135deg,#7a2626,#a83232);color:#f5e2d8}
.card-title{font-size:16px;font-weight:600}
.card-desc{font-size:12px;color:var(--muted);margin-top:2px}
.card-arrow{margin-left:auto;color:var(--dim);font-size:24px}
.home-foot{text-align:center;margin-top:30px;color:var(--dim);font-size:12px}
.link-btn{color:var(--gold2);font-size:12px;margin-top:8px;text-decoration:underline;opacity:.85}
.script-count{margin-bottom:4px}

/* 页头 */
.page-head{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.page-head h2{font-size:18px;margin:0;font-weight:600}
.back-btn{color:var(--muted);font-size:14px;padding:4px 0}
.back-btn:hover{color:var(--text)}

/* 剧本列表 */
.script-list{display:flex;flex-direction:column;gap:12px}
.script-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;
  border-left:3px solid var(--gold)}
.script-card .sc-top{display:flex;align-items:baseline;gap:8px;margin-bottom:4px}
.script-card .sc-title{font-size:17px;font-weight:600}
.script-card .sc-sub{font-size:12px;color:var(--muted)}
.script-card .sc-desc{font-size:13px;color:var(--muted);line-height:1.6;margin:8px 0}
.script-card .sc-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tag{font-size:11px;padding:2px 9px;border-radius:20px;background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
.tag.gold{color:var(--gold2);border-color:#6b5218}

/* 表单 */
.form-body{display:flex;flex-direction:column;gap:22px;padding-top:6px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:9px;letter-spacing:.5px}
.field input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:9px;
  padding:13px 14px;font-size:15px;transition:.18s}
.field input:focus{border-color:var(--gold)}
.field input::placeholder{color:var(--dim)}
.code-input{letter-spacing:6px;font-size:20px !important;text-transform:uppercase;text-align:center;font-weight:600}
.pick-list{display:flex;flex-direction:column;gap:8px}
.pick-item{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:12px 14px;text-align:left;transition:.18s;width:100%}
.pick-item.active{border-color:var(--gold);background:#2e2417}
.pick-item .pi-num{width:26px;height:26px;flex:none;border-radius:50%;background:var(--panel2);
  border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--gold2)}
.pick-item.active .pi-num{background:var(--gold);color:#1a1512;border-color:var(--gold)}
.pick-item .pi-main{flex:1}
.pick-item .pi-title{font-size:14px;font-weight:600}
.pick-item .pi-sub{font-size:11px;color:var(--muted);margin-top:2px}
.pick-item .pi-check{color:var(--gold2);font-size:18px;opacity:0}
.pick-item.active .pi-check{opacity:1}
.seg{display:flex;flex-direction:column;gap:8px}
.seg-btn{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;text-align:left;transition:.18s}
.seg-btn.active{border-color:var(--gold);background:#2e2417}
.seg-btn b{display:block;font-size:14px;font-weight:600}
.seg-btn small{display:block;color:var(--muted);font-size:11px;margin-top:3px}
.primary-btn{width:100%;background:linear-gradient(135deg,#a8801c,#d4af37);color:#18120c;
  font-weight:700;font-size:16px;letter-spacing:1px;padding:15px;border-radius:10px;transition:.18s}
.primary-btn:active{transform:scale(.98)}
.hint{font-size:12px;color:var(--dim);text-align:center;margin:-8px 0 0}

/* 大厅 */
.lobby-head{display:flex;align-items:center;justify-content:space-between;background:var(--panel);
  border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.lobby-label{font-size:11px;color:var(--muted);letter-spacing:2px}
.lobby-code{font-size:30px;font-weight:700;letter-spacing:6px;color:var(--gold2);font-family:ui-monospace,monospace}
.ghost-btn{border:1px solid var(--line2);background:var(--panel2);color:var(--muted);
  padding:8px 14px;border-radius:8px;font-size:12px;transition:.18s}
.ghost-btn:hover{color:var(--text);border-color:var(--gold)}
.ghost-btn.wide{width:100%;padding:12px}
.qr-wrap{display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 0 6px}
#qrCanvas{background:#fff;border-radius:10px;padding:8px;width:180px;height:180px}
.qr-tip{font-size:11px;color:var(--dim)}
.section-label{font-size:12px;color:var(--muted);letter-spacing:1px;margin:20px 0 10px;
  padding-bottom:6px;border-bottom:1px solid var(--line)}
.lobby-script{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--gold);
  border-radius:10px;padding:12px 14px}
.lobby-script .ls-title{font-size:16px;font-weight:600}
.lobby-script .ls-sub{font-size:12px;color:var(--muted);margin-top:3px}
.seat-list{display:flex;flex-direction:column;gap:8px}
.seat{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);
  border-radius:9px;padding:10px 12px}
.seat-dot{width:10px;height:10px;border-radius:50%;flex:none}
.seat-name{flex:1;font-size:14px}
.seat-tag{font-size:11px;color:var(--muted)}
.seat-host{font-size:10px;color:var(--gold2);border:1px solid var(--gold);padding:1px 6px;border-radius:10px}
.seat-offline{opacity:.5}
.role-pick-list{display:flex;flex-direction:column;gap:7px}
.role-pick{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);
  border-radius:9px;padding:10px 12px;width:100%;text-align:left;transition:.18s}
.role-pick.mine{border-color:var(--gold);background:#2e2417}
.role-pick.taken{opacity:.6}
.role-pick .rp-name{font-size:14px;font-weight:600}
.role-pick .rp-title{font-size:11px;color:var(--muted)}
.role-pick .rp-status{margin-left:auto;font-size:11px;color:var(--gold2)}
.lobby-actions{margin-top:22px;display:flex;flex-direction:column;gap:10px}
.dm-entry{margin-top:14px}
.wait-note{text-align:center;color:var(--muted);font-size:13px;padding:14px}

/* 游戏 */
.game-head{margin:-4px 0 14px}
.game-title{font-size:20px;font-weight:600}
.act-progress{display:flex;gap:6px;margin-top:10px}
.act-dot{flex:1;height:4px;border-radius:3px;background:var(--line);transition:.3s}
.act-dot.on{background:var(--gold)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:10px 14px;font-size:13px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tab.active{color:var(--gold2);border-color:var(--gold)}
.tab.dm-tab{color:var(--red2)}
.tab-body{padding-top:16px}
.tab-pane{display:none}
.tab-pane.active{display:block;animation:fade .2s}

/* 通用内容块 */
.block{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:16px;margin-bottom:12px}
.block-title{font-size:13px;color:var(--gold2);letter-spacing:1px;margin-bottom:10px;
  display:flex;align-items:center;gap:7px}
.block-title::before{content:'';width:3px;height:13px;background:var(--gold);border-radius:2px}
.prose{font-size:14px;line-height:1.85;color:var(--text);white-space:pre-wrap;word-break:break-word}
.prose.muted{color:var(--muted);font-size:13px}
.role-header{text-align:center;padding:8px 0 18px;border-bottom:1px solid var(--line);margin-bottom:16px}
.role-name{font-size:24px;font-weight:600;letter-spacing:2px}
.role-title{font-size:13px;color:var(--gold2);margin-top:4px}
.locked{opacity:.45;font-style:italic}
.act-divider{display:flex;align-items:center;gap:10px;margin:18px 0 12px;color:var(--muted);font-size:12px}
.act-divider::before,.act-divider::after{content:'';flex:1;height:1px;background:var(--line)}

/* 线索 */
.clue-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px}
.clue-card .clue-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.clue-card .clue-name{font-size:14px;font-weight:600;flex:1}
.clue-badge{font-size:10px;padding:2px 7px;border-radius:10px;border:1px solid var(--line2);color:var(--muted)}
.clue-badge.pub{color:#7fb8d8;border-color:#2d5468}
.clue-badge.pri{color:var(--gold2);border-color:#6b5218}
.clue-badge.src{color:#a8d0a8;border-color:#3c6b3c}
.clue-content{font-size:13px;color:var(--muted);line-height:1.7;white-space:pre-wrap}
.search-list{margin-top:6px}
.search-item{display:flex;align-items:center;gap:10px;background:var(--bg2);border:1px dashed var(--line2);
  border-radius:8px;padding:10px 12px;margin-bottom:8px}
.search-item .si-name{flex:1;font-size:13px}
.mini-btn{border:1px solid var(--gold);color:var(--gold2);padding:4px 12px;border-radius:14px;font-size:12px}
.mini-btn:disabled{opacity:.4;border-color:var(--line2);color:var(--dim)}

/* 聊天 */
.chat-list{display:flex;flex-direction:column;gap:10px;padding-bottom:70px}
.msg{display:flex;flex-direction:column;max-width:86%}
.msg.mine{align-self:flex-end;align-items:flex-end}
.msg-head{font-size:11px;color:var(--dim);margin-bottom:3px;padding:0 4px}
.msg-bubble{background:var(--panel);border:1px solid var(--line);border-radius:10px 10px 10px 3px;
  padding:9px 12px;font-size:14px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.msg.mine .msg-bubble{background:#3a2d16;border-color:#6b5218;border-radius:10px 10px 3px 10px}
.msg.private .msg-bubble{border-color:#6b3b3b;background:#2b1d1d}
.msg.sys{align-self:center;max-width:96%;text-align:center}
.msg.sys .msg-bubble{background:transparent;border:none;color:var(--dim);font-size:12px;padding:4px}
.chat-input-bar{position:fixed;bottom:0;left:0;right:0;max-width:560px;margin:0 auto;
  display:flex;gap:8px;padding:10px 14px;background:rgba(20,16,14,.97);border-top:1px solid var(--line);z-index:20}
.chat-input-bar select{background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:0 8px;font-size:12px;color:var(--muted);max-width:92px}
.chat-input-bar input{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px}
.send-btn{background:var(--gold);color:#18120c;font-weight:600;padding:0 16px;border-radius:8px;font-size:13px}

/* 投票 */
.vote-item{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:13px 14px;margin-bottom:8px;width:100%;text-align:left;transition:.18s}
.vote-item.active{border-color:var(--gold);background:#2e2417}
.vote-item.disabled{opacity:.5;pointer-events:none}
.vote-radio{width:18px;height:18px;border:1px solid var(--line2);border-radius:50%;flex:none}
.vote-item.active .vote-radio{border:5px solid var(--gold)}
.vote-name{flex:1;font-size:14px}
.vote-count{font-size:13px;color:var(--gold2)}
.vote-submit{margin-top:16px}

/* 真相 */
.truth-hero{text-align:center;padding:20px 0;border-bottom:1px solid var(--line);margin-bottom:18px}
.truth-killer{font-size:13px;color:var(--muted);letter-spacing:2px}
.truth-killer-name{font-size:28px;color:var(--red2);font-weight:700;margin-top:6px;letter-spacing:2px}
.truth-section{margin-bottom:18px}
.truth-section h4{font-size:13px;color:var(--gold2);margin:0 0 8px;letter-spacing:1px}
.timeline-item{display:flex;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line)}
.timeline-time{color:var(--gold2);font-size:12px;flex:none;width:88px}
.timeline-text{font-size:13px;color:var(--muted);flex:1}

/* 控场台 */
.dm-badge{display:inline-block;background:var(--red);color:#fff;font-size:10px;padding:2px 8px;border-radius:10px;margin-left:8px}
.dm-row{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.dm-row select,.dm-row input{flex:1;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:13px;min-width:0}
.dm-btn{background:var(--panel2);border:1px solid var(--line2);padding:8px 12px;border-radius:8px;font-size:12px;white-space:nowrap}
.dm-btn:hover{border-color:var(--gold);color:var(--gold2)}
.dm-btn.danger{border-color:#6b3030;color:#d98a8a}
.dm-player{display:flex;align-items:center;justify-content:space-between;background:var(--bg2);
  border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin-bottom:7px;font-size:13px}
.dm-player .dp-online{font-size:10px;color:#7fb8d8}

/* 弹层 */
.modal{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.modal-bg{position:absolute;inset:0;background:rgba(0,0,0,.72)}
.modal-box{position:relative;background:var(--panel);border:1px solid var(--line2);border-radius:14px;
  width:100%;max-width:420px;box-shadow:var(--shadow);overflow:hidden}
.modal-title{font-size:17px;font-weight:600;padding:18px 20px 0}
.modal-body{padding:14px 20px;font-size:14px;color:var(--muted);line-height:1.7}
.modal-foot{padding:0 20px 18px;display:flex;gap:10px;justify-content:flex-end}
.modal-foot button{padding:9px 18px;border-radius:8px;font-size:13px}
.modal-cancel{background:var(--panel2);border:1px solid var(--line2);color:var(--muted)}
.modal-ok{background:var(--gold);color:#18120c;font-weight:600}

/* Toast */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);z-index:200;
  background:#33281c;border:1px solid var(--gold);color:var(--gold2);padding:10px 20px;
  border-radius:24px;font-size:13px;white-space:nowrap;box-shadow:var(--shadow)}

/* 桌面适配 */
@media(min-width:600px){
  #app{border-left:1px solid var(--line);border-right:1px solid var(--line);
    box-shadow:0 0 60px rgba(0,0,0,.3)}
  .chat-input-bar{max-width:560px}
}

</style>
</head>
<body>
<div id="app">
  <!-- 顶部 -->
  <header id="topbar" class="hidden">
    <div class="brand" onclick="UI.goHome()">
      <span class="brand-mark">剧</span>
      <span class="brand-text" id="topTitle">剧本杀</span>
    </div>
    <div class="top-actions">
      <span class="code-chip" id="topCode"></span>
      <button class="icon-btn" id="btnLeave" title="退出">✕</button>
    </div>
  </header>

  <!-- 首页 -->
  <section id="page-home" class="page active">
    <div class="hero">
      <div class="hero-deco">❖</div>
      <h1>剧本杀 · 联机局</h1>
      <p class="hero-sub">2–5 人 · 手机联机 · 分幕后自动解锁剧本</p>
    </div>
    <div class="home-cards">
      <button class="big-card" onclick="UI.showCreate()">
        <div class="card-icon">＋</div>
        <div>
          <div class="card-title">创建房间</div>
          <div class="card-desc">选一本剧，开一个局</div>
        </div>
        <div class="card-arrow">›</div>
      </button>
      <button class="big-card" onclick="UI.showJoin()">
        <div class="card-icon alt">◇</div>
        <div>
          <div class="card-title">加入房间</div>
          <div class="card-desc">输入 6 位房间号</div>
        </div>
        <div class="card-arrow">›</div>
      </button>
    </div>
    <div class="home-foot">
      <div class="script-count" id="scriptCount">正在载入剧本…</div>
      <button class="link-btn" onclick="UI.showScriptList()">查看内置剧本 ›</button>
    </div>
  </section>

  <!-- 剧本列表 -->
  <section id="page-scripts" class="page">
    <div class="page-head">
      <button class="back-btn" onclick="UI.goHome()">‹ 返回</button>
      <h2>内置剧本</h2>
    </div>
    <div id="scriptList" class="script-list"></div>
  </section>

  <!-- 创建房间 -->
  <section id="page-create" class="page">
    <div class="page-head">
      <button class="back-btn" onclick="UI.goHome()">‹ 返回</button>
      <h2>创建房间</h2>
    </div>
    <div class="form-body">
      <div class="field">
        <label>你的昵称</label>
        <input id="createName" maxlength="12" placeholder="怎么称呼你">
      </div>
      <div class="field">
        <label>选择剧本</label>
        <div id="createScriptList" class="pick-list"></div>
      </div>
      <div class="field">
        <label>控场模式</label>
        <div class="seg" id="modeSeg">
          <button class="seg-btn active" data-mode="auto" onclick="UI.pickMode('auto')">
            <b>自动推进</b><small>房主点下一幕，无需主持人</small>
          </button>
          <button class="seg-btn" data-mode="dm" onclick="UI.pickMode('dm')">
            <b>主持人模式</b><small>专人控场、私聊、发线索</small>
          </button>
        </div>
      </div>
      <button class="primary-btn" onclick="UI.doCreate()">创建房间</button>

<script>
/* 轻量 QR 码生成器：字节模式，纠错级别 M，无外部依赖 */
(function (global) {
  'use strict';

  const EXP = new Uint8Array(512), LOG = new Uint8Array(256);
  (function () {
    let x = 1;
    for (let i = 0; i < 255; i++) { EXP[i] = x; LOG[x] = i; x <<= 1; if (x & 0x100) x ^= 0x11d; }
    for (let i = 255; i < 512; i++) EXP[i] = EXP[i - 255];
  })();
  function mul(a, b) { return (a && b) ? EXP[LOG[a] + LOG[b]] : 0; }

  const CAP = [0, 14, 26, 42, 62, 84, 106, 122, 152, 180, 213, 251, 287, 331, 362, 412, 450, 504, 560, 624, 666, 711, 779, 857, 911, 997];
  const EC_PER_BLOCK = [0, 10, 16, 26, 18, 24, 16, 18, 22, 22, 26, 30, 22, 22, 24, 24, 28, 28, 26, 26, 26, 26, 28, 28, 28, 28];
  const BLOCKS = {
    1: [1, 16], 2: [1, 28], 3: [1, 44], 4: [2, 32], 5: [2, 43],
    6: [4, 27], 7: [4, 31], 8: [4, 38], 9: [5, 36], 10: [5, 43],
    11: [5, 50], 12: [8, 34], 13: [9, 36], 14: [9, 40], 15: [10, 42]
  };

  function utf8Bytes(str) {
    const out = [];
    for (let i = 0; i < str.length; i++) {
      const c = str.charCodeAt(i);
      if (c < 0x80) out.push(c);
      else if (c < 0x800) out.push(0xc0 | (c >> 6), 0x80 | (c & 0x3f));
      else out.push(0xe0 | (c >> 12), 0x80 | ((c >> 6) & 0x3f), 0x80 | (c & 0x3f));
    }
    return out;
  }

  function reedSolomon(data, ecLen) {
    const gen = new Uint8Array(ecLen); gen[ecLen - 1] = 1;
    let root = 1;
    for (let i = 0; i < ecLen; i++) {
      for (let j = 0; j < ecLen; j++) {
        gen[j] = mul(gen[j], root);
        if (j + 1 < ecLen) gen[j] ^= gen[j + 1];
      }
      root = mul(root, 2);
    }
    const res = new Uint8Array(ecLen);
    for (const b of data) {
      const factor = b ^ res[0];
      res.copyWithin(0, 1);
      res[ecLen - 1] = 0;
      if (factor) for (let i = 0; i < ecLen; i++) res[i] ^= mul(gen[i], factor);
    }
    return res;
  }

  // 格式信息：纠错 M（2 位 = 00）+ 掩码 0（3 位 = 000）→ 数据 00000 → BCH → 0x5412
  const FMT = 0x5412;

  function makeMatrix(version, dataBytes) {
    const size = version * 4 + 17;
    const m = Array.from({ length: size }, () => new Int8Array(size).fill(0));
    const fn = Array.from({ length: size }, () => new Uint8Array(size));
    function setF(x, y, v) { if (x >= 0 && y >= 0 && x < size && y < size) { m[y][x] = v; fn[y][x] = 1; } }

    function finder(ox, oy) {
      for (let dy = -1; dy <= 7; dy++) for (let dx = -1; dx <= 7; dx++) {
        const x = ox + dx, y = oy + dy;
        const on = dx >= 0 && dx <= 6 && dy >= 0 && dy <= 6 &&
          (dx === 0 || dx === 6 || dy === 0 || dy === 6 || (dx >= 2 && dx <= 4 && dy >= 2 && dy <= 4)) ? 1 : 0;
        setF(x, y, on);
      }
    }
    finder(0, 0); finder(size - 7, 0); finder(0, size - 7);

    if (version >= 2) {
      const alignPos = [6, size - 7];
      for (const ay of alignPos) for (const ax of alignPos) {
        if ((ax === 6 && ay === 6) || (ax === 6 && ay === size - 7) || (ax === size - 7 && ay === 6)) continue;
        for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) {
          setF(ax + dx, ay + dy, (Math.abs(dx) === 2 || Math.abs(dy) === 2 || (dx === 0 && dy === 0)) ? 1 : 0);
        }
      }
    }

    for (let i = 8; i < size - 8; i++) { setF(i, 6, i % 2 === 0 ? 1 : 0); setF(6, i, i % 2 === 0 ? 1 : 0); }

    // 格式信息区域（先填 0 占位）
    for (let i = 0; i < 9; i++) { setF(8, i, 0); setF(i, 8, 0); }
    for (let i = 0; i < 8; i++) { setF(size - 1 - i, 8, 0); setF(8, size - 1 - i, 0); }
    setF(8, size - 8, 1);

    // 版本信息（version >= 7）
    if (version >= 7) {
      for (let i = 0; i < 18; i++) {
        const bit = (version >> i) & 1;
        const a = size - 11 + (i % 3), b = Math.floor(i / 3);
        setF(a, b, bit); setF(b, a, bit);
      }
    }

    // 数据填充
    let bitIdx = 0;
    const totalBits = dataBytes.length * 8;
    let upward = true;
    for (let x = size - 1; x >= 1; x -= 2) {
      if (x === 6) x = 5;
      for (let i = 0; i < size; i++) {
        const y = upward ? size - 1 - i : i;
        for (let c = 0; c < 2; c++) {
          const px = x - c, py = y;
          if (fn[py][px]) continue;
          let bit = 0;
          if (bitIdx < totalBits) bit = (dataBytes[bitIdx >> 3] >> (7 - (bitIdx & 7))) & 1;
          m[py][px] = bit; bitIdx++;
        }
      }
      upward = !upward;
    }

    // 掩码 0
    for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
      if (!fn[y][x] && (x + y) % 2 === 0) m[y][x] ^= 1;
    }

    // 写格式信息（标准位置）
    for (let i = 0; i < 15; i++) {
      const bit = (FMT >> i) & 1;
      // 左上
      if (i <= 5) m[i][8] = bit;
      else if (i <= 7) m[i + 1][8] = bit;
      else if (i === 8) m[8][7] = bit;
      else m[8][14 - i] = bit;
      // 右上 + 左下
      if (i < 8) m[8][size - 1 - i] = bit;
      else m[size - 15 + i][8] = bit;
    }
    m[size - 8][8] = 1;

    return m;
  }

  function encode(text) {
    const bytes = utf8Bytes(text);
    let version = 0;
    for (let v = 1; v <= 15; v++) if (CAP[v] >= bytes.length) { version = v; break; }
    if (!version) throw new Error('内容过长');
    const [numBlocks, dataCodewords] = BLOCKS[version];
    const ecLen = EC_PER_BLOCK[version];
    const totalData = dataCodewords * numBlocks;

    const bits = [];
    function push(val, len) { for (let i = len - 1; i >= 0; i--) bits.push((val >> i) & 1); }
    push(4, 4);
    push(bytes.length, version < 10 ? 8 : 16);
    for (const b of bytes) push(b, 8);
    while (bits.length < totalData * 8) bits.push(0);
    const dataBytes = [];
    for (let i = 0; i < totalData; i++) {
      let b = 0; for (let j = 0; j < 8; j++) b = (b << 1) | bits[i * 8 + j];
      dataBytes.push(b);
    }

    const blocks = [], ecs = [];
    let pos = 0;
    for (let i = 0; i < numBlocks; i++) {
      const blk = dataBytes.slice(pos, pos + dataCodewords); pos += dataCodewords;
      blocks.push(blk); ecs.push(reedSolomon(blk, ecLen));
    }
    const final = [];
    for (let i = 0; i < dataCodewords; i++) for (const b of blocks) final.push(b[i]);
    for (let i = 0; i < ecLen; i++) for (const e of ecs) final.push(e[i]);

    return makeMatrix(version, final);
  }

  function draw(canvas, text) {
    const m = encode(text), size = m.length;
    const ctx = canvas.getContext('2d');
    const w = canvas.width, h = canvas.height;
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
    const cell = Math.floor(Math.min(w, h) / (size + 8));
    const ox = Math.floor((w - cell * size) / 2), oy = Math.floor((h - cell * size) / 2);
    ctx.fillStyle = '#000';
    for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
      if (m[y][x] === 1) ctx.fillRect(ox + x * cell, oy + y * cell, cell, cell);
    }
  }

  global.QRCode = { encode, draw };
})(window);

</script>
<script>
const SITE_CONFIG = {"backendWS":"wss://weight-calc.app.workbuddy.host/ws?sharecode=XOFBXF6WEQ","scripts":[{"id":"2p-cat","title":"猫粮失踪案","subtitle":"一只橘猫，两个铲屎官，一场喵界悬案","players":2,"genre":"欢乐轻松","duration":"20-30分钟","difficulty":"★☆☆☆☆","killerMode":"npc","roleCount":2,"clueCount":10},{"id":"2p-lighthouse","title":"孤灯谜影","subtitle":"暴雨夜的孤岛灯塔","players":2,"genre":"悬疑惊悚","duration":"20-30分钟","difficulty":"★★★☆☆","killerMode":"npc","roleCount":2,"clueCount":10},{"id":"3p-dinner","title":"黑暗料理晚宴","subtitle":"三个人，一锅汤，一个崩溃的美食博主","players":3,"genre":"欢乐轻松","duration":"30-40分钟","difficulty":"★★☆☆☆","killerMode":"player","roleCount":3,"clueCount":10},{"id":"3p-family","title":"余温","subtitle":"一栋房子里，三个女人的秘密","players":3,"genre":"情感沉浸","duration":"30-40分钟","difficulty":"★★★☆☆","killerMode":"player","roleCount":3,"clueCount":10},{"id":"4p-clock","title":"钟摆之下","subtitle":"一座古镇，四个人，一枚停摆的怀表","players":4,"genre":"硬核推理","duration":"40-60分钟","difficulty":"★★★★☆","killerMode":"player","roleCount":4,"clueCount":12},{"id":"4p-office","title":"年会大奖失踪事件","subtitle":"一台吹风机引发的公司惨案","players":4,"genre":"欢乐轻松","duration":"35-50分钟","difficulty":"★★☆☆☆","killerMode":"player","roleCount":4,"clueCount":11},{"id":"5p-theatre","title":"第七场谢幕","subtitle":"剧院里，没有人是旁观者","players":5,"genre":"情感沉浸 · 悬疑","duration":"50-70分钟","difficulty":"★★★★☆","killerMode":"player","roleCount":5,"clueCount":12},{"id":"5p-wedding","title":"伴娘团失踪事件","subtitle":"一场婚礼，五个伴娘，一个新娘的崩溃","players":5,"genre":"欢乐轻松","duration":"50-70分钟","difficulty":"★★★☆☆","killerMode":"player","roleCount":5,"clueCount":12}]};
'use strict';

// ============ 全局状态 ============
const S = {
  ws: null, scripts: [], selectedScript: null, mode: 'auto',
  code: null, playerId: null, token: null, isDM: false,
  state: null, tab: 'script', chatTarget: '__all',
  connected: false, reconnectTimer: null
};

const $ = id => document.getElementById(id);
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.remove('hidden');
  clearTimeout(t._timer); t._timer = setTimeout(() => t.classList.add('hidden'), 2200);
}

// ============ 网络 ============
// 线上发布链接通过 sharecode 路由，页面和 WebSocket 都必须带上它，朋友打开邀请链接也要保留
function shareCodeParam() {
  try {
    const sc = new URLSearchParams(location.search).get('sharecode');
    return sc ? '?sharecode=' + encodeURIComponent(sc) : '';
  } catch (e) { return ''; }
}
function baseURL() {
  // 静态版（GitHub Pages）部署在子路径，用当前路径而非站点根
  const path = location.pathname.endsWith('/') ? location.pathname : location.pathname.replace(/\/[^/]*$/, '/');
  return location.origin + path + shareCodeParam();
}
function wsURL() {
  // 静态版没有自己的后端，联机走固定的线上服务；本地/WorkBuddy 版仍用当前域名
  if (typeof SITE_CONFIG !== 'undefined' && SITE_CONFIG.backendWS) return SITE_CONFIG.backendWS;
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  return proto + '//' + location.host + '/ws' + shareCodeParam();
}
function connect(onOpen) {
  if (S.ws && S.ws.readyState === 1) {
    // 已连接：立即执行回调
    if (onOpen) onOpen();
    return;
  }
  if (S.ws && S.ws.readyState === 0) {
    // 连接中：等它打开后执行回调
    if (onOpen) {
      const prev = S.ws.onopen;
      S.ws.onopen = () => { if (prev) prev(); onOpen(); };
    }
    return;
  }
  const ws = new WebSocket(wsURL());
  S.ws = ws;
  ws.onopen = () => {
    S.connected = true;
    if (onOpen) onOpen();
  };
  ws.onmessage = e => {
    let msg; try { msg = JSON.parse(e.data); } catch (_) { return; }
    if (msg.type === 'state') { S.state = msg.state; render(); }
    else if (msg.type === 'error') toast(msg.message);
    else if (msg.type === 'joined') {
      S.code = msg.code; S.playerId = msg.playerId; S.token = msg.token; S.isDM = msg.isDM;
      localStorage.setItem('murder_session', JSON.stringify({
        code: msg.code, token: msg.token, isDM: msg.isDM
      }));
    }
  };
  ws.onclose = () => {
    S.connected = false;
    if (S.code) {
      toast('连接断开，正在重连…');
      S.reconnectTimer = setTimeout(() => resume(), 1200);
    }
  };
  ws.onerror = () => {};
}
function send(obj) {
  if (!S.ws || S.ws.readyState !== 1) { toast('连接中，请稍候'); return; }
  S.ws.send(JSON.stringify(obj));
}
function resume() {
  const saved = JSON.parse(localStorage.getItem('murder_session') || 'null');
  if (!saved || !saved.code) return;
  S.code = saved.code;
  connect(() => send({ type: 'resume', code: saved.code, token: saved.token }));
}

function showPage(id) {

}

}

    (p.isHost ? '<span class="seat-host">房主</span>' : '') +

  $('rolePickList').innerHTML = st.script.roleList.map(r => {

    return '<button class="role-pick ' + (mine ? 'mine' : '') + ' ' + (taken && !mine ? 'taken' : '') +

  } else $('dmEntry').classList.add('hidden');

  // 二维码

function renderScriptPane() {

  if (!role) {

    h += '<div class="block"><div class="role-header">' +
      '<div class="role-name">' + esc(role.name) + '</div>' +
      '<div class="role-title">' + esc(role.title) + '</div></div>' +
      '<div class="block-title">你的身份</div>' +
      '<div class="prose">' + esc(role.public) + '</div></div>';
    h += '<div class="block"><div class="block-title">你的秘密</div>' +
      '<div class="prose">' + esc(role.secret) + '</div></div>';
    h += '<div class="block"><div class="block-title">你的目标</div>' +
      '<div class="prose">' + esc(role.goal) + '</div></div>';
  }
  h += '<div class="act-divider">分幕剧本</div>';
  st.script.acts.forEach(a => {
    h += '<div class="block ' + (a.unlocked ? '' : 'locked') + '">' +
      '<div class="block-title">' + esc(a.title) + (a.unlocked ? '' : ' · 未解锁') + '</div>';
    if (a.narration) h += '<div class="prose muted">' + esc(a.narration) + '</div>';
    if (a.task) h += '<div class="prose muted" style="margin-top:8px">【任务】' + esc(a.task) + '</div>';
    if (role) {
      const mine = role.acts.find(x => x.act === a.index);
      if (mine && a.unlocked) h += '<div class="prose" style="margin-top:12px;padding-top:12px;border-top:1px solid var(--line)">' + esc(mine.content) + '</div>';
    }
    h += '</div>';
  });
  $('pane-script').innerHTML = h;
}

function renderCluesPane() {
  const st = S.state;
  let h = '';
  if (st.clues.length) {
    st.clues.forEach(c => {
      const badge = c.type === 'public' ? '<span class="clue-badge pub">公开</span>'
        : c.type === 'private' ? '<span class="clue-badge pri">专属</span>'
        : '<span class="clue-badge src">' + (c.via === 'grant' ? '获发' : '搜证') + '</span>';
      h += '<div class="clue-card"><div class="clue-top">' +
        '<span class="clue-name">' + esc(c.title) + '</span>' + badge + '</div>' +
        '<div class="clue-content">' + esc(c.content) + '</div></div>';
    });
  } else h += '<div class="block"><div class="prose muted">还没有线索。随着剧情推进会逐步解锁。</div></div>';

  // 可搜证线索（search 类型，未获得）
  if (st.status === 'playing' && !st.isDM) {
    const owned = new Set(st.clues.map(c => c.id));
    const searchable = st.script.cluePool ? [] : [];
    // search 线索不在公开池里（仅 DM 可见 cluePool），用提示方式让玩家请求
    h += '<div class="block"><div class="block-title">搜证</div>' +
      '<div class="prose muted">点击搜证可抽取当前幕未获得的线索。</div>' +
      '<div class="search-list" id="searchList"></div></div>';
    // 用 clueId 序列尝试（前端不知道 search 线索 id，用索引遍历 1..20 探测）
    setTimeout(renderSearchable, 0);
  }
  $('pane-clues').innerHTML = h;
}

function renderSearchable() {
  const st = S.state;
  const el = $('searchList'); if (!el) return;
  const owned = new Set(st.clues.map(c => c.id));
  // 通过公开线索计数与已获线索推断：用 c1..c30 尝试
  // 更稳妥：服务端下发 search 线索的 id/标题（不含内容）给玩家
  // 这里用服务端新字段 searchables
  const list = st.searchables || [];
  if (!list.length) { el.innerHTML = '<div class="prose muted" style="font-size:12px">当前幕暂无可搜证线索</div>'; return; }
  el.innerHTML = list.filter(c => !owned.has(c.id)).map(c =>
    '<div class="search-item"><span class="si-name">' + esc(c.title) + '</span>' +
    '<button class="mini-btn" onclick="UI.searchClue(\'' + c.id + '\')">搜证</button></div>'
  ).join('') || '<div class="prose muted" style="font-size:12px">当前幕线索已全部搜到</div>';
}

function renderChatPane() {
  const st = S.state;
  // 服务端已按玩家身份过滤消息；这里按标签进一步区分公聊/私聊
  const list = st.messages.filter(m => {
    if (S.chatTarget === '__all') return m.channel === 'public';
    if (S.chatTarget === '__dm_players') return m.channel === 'private' && String(m.text).indexOf('【主持人】') === 0;
    return m.channel === 'private';
  });
  let h = '<div class="chat-list">';
  list.forEach(m => {
    if (m.channel === 'public' && m.fromName === '系统') {
      h += '<div class="msg sys"><div class="msg-bubble">' + esc(m.text) + '</div></div>';
      return;
    }
    const mine = m.mine || (m.fromName === st.you.name);
    h += '<div class="msg ' + (mine ? 'mine' : '') + ' ' + (m.channel === 'private' ? 'private' : '') + '">' +
      '<div class="msg-head">' + esc(m.fromName) + (m.channel === 'private' ? ' → ' + esc(m.toName || '') : '') + ' · ' + m.time + '</div>' +
      '<div class="msg-bubble">' + esc(m.text) + '</div></div>';
  });
  h += '</div>';
  $('pane-chat').innerHTML = h;

  // 输入栏
  let bar = $('chatBar');
  if (!bar) {
    bar = document.createElement('div'); bar.id = 'chatBar'; bar.className = 'chat-input-bar';
    document.body.appendChild(bar);
  }
  const others = st.players.filter(p => p.id !== S.playerId && !p.isDM);
  let opts = '<option value="__all">公聊</option>' +
    others.map(p => '<option value="' + p.id + '" ' + (S.chatTarget === p.id ? 'selected' : '') + '>私聊 ' + esc(p.name) + '</option>').join('');
  if (st.isDM) opts += '<option value="__dm_players">私聊全体</option>';
  bar.innerHTML = '<select id="chatTarget" onchange="UI.setChatTarget(this.value)">' + opts + '</select>' +
    '<input id="chatInput" placeholder="说点什么…" onkeydown="if(event.key===\'Enter\')UI.sendChat()">' +
    '<button class="send-btn" onclick="UI.sendChat()">发送</button>';
  setTimeout(() => { const el = $('pane-chat'); if (el) el.scrollTop = el.scrollHeight; }, 30);
}

function renderVotePane() {
  const st = S.state;
  const v = st.voting;
  let h = '<div class="block"><div class="block-title">' + esc(v.title || '投票') + '</div>' +
    '<div class="prose muted">' + esc(v.description || '选择你要指认的对象') + '</div></div>';
  if (v.enabled) {
    h += '<div>' + v.targets.map((t, i) => {
      const mine = st.you.myVote === i;
      const cnt = st.revealed ? (v.count[i] || 0) : null;
      return '<button class="vote-item ' + (mine ? 'active' : '') + ' ' +
        (st.revealed || st.isDM || st.status !== 'playing' ? 'disabled' : '') +
        '" onclick="UI.vote(' + i + ')">' +
        '<span class="vote-radio"></span><span class="vote-name">' + esc(t) + '</span>' +
        (cnt !== null ? '<span class="vote-count">' + cnt + ' 票</span>' : '') + '</button>';
    }).join('') + '</div>';
    h += '<div class="prose muted" style="text-align:center;margin-top:14px;font-size:12px">' +
      '已投票 ' + v.votedCount + '/' + v.totalVoters + (st.revealed ? ' · 结果已揭晓' : '') + '</div>';
    if (st.canControl && st.status === 'playing') {
      h += '<button class="primary-btn vote-submit" onclick="UI.reveal()">揭晓真相</button>';
    }
  } else {
    h += '<div class="block"><div class="prose muted">本案为双人合作推理，无投票环节。讨论一致后由房主揭晓真相。</div></div>';
    if (st.canControl && st.status === 'playing') {
      h += '<button class="primary-btn vote-submit" onclick="UI.reveal()">揭晓真相</button>';
    }
  }
  $('pane-vote').innerHTML = h;
}

function renderDMPane() {
  const st = S.state;
  if (!st.isDM) { $('pane-dm').innerHTML = ''; return; }
  let h = '<div class="block"><div class="block-title">进度控制</div>' +
    '<div class="dm-row">' +
    '<button class="dm-btn" onclick="UI.nextAct()">下一幕 ›</button>' +
    '<button class="dm-btn danger" onclick="UI.reveal()">揭晓真相</button></div>' +
    '<div class="dm-row"><span style="font-size:12px;color:var(--muted)">当前：第 ' + st.act + ' / ' + st.script.acts.length + ' 幕</span></div>' +
    '<div class="dm-row">' + st.script.acts.map(a =>
      '<button class="dm-btn" onclick="UI.setAct(' + a.index + ')">' + a.index + '</button>').join('') + '</div></div>';

  h += '<div class="block"><div class="block-title">发线索</div>' +
    '<div class="dm-row"><select id="dmClue">' +
    (st.script.cluePool || []).map(c => '<option value="' + c.id + '">' + esc(c.title) + '（' + c.type + '）</option>').join('') +
    '</select></div><div class="dm-row"><select id="dmPlayer">' +
    st.players.filter(p => !p.isDM).map(p => '<option value="' + p.id + '">' + esc(p.name) + '</option>').join('') +
    '</select><button class="dm-btn" onclick="UI.giveClue()">发放</button></div></div>';

  h += '<div class="block"><div class="block-title">玩家状态</div>' +
    st.players.filter(p => !p.isDM).map(p =>
      '<div class="dm-player"><span>' + esc(p.name) + ' · ' + esc(p.roleName || '未分配') + '</span>' +
      '<span class="dp-online">' + (p.online ? '在线' : '离线') + '</span></div>').join('') + '</div>';

  h += '<div class="block"><div class="block-title">私聊</div>' +
    '<div class="prose muted" style="font-size:12px">在「讨论」标签选择私聊对象即可单独对话。</div></div>';
  $('pane-dm').innerHTML = h;
}

function renderTruthPane() {
  const st = S.state;
  if (!st.revealed || !st.truth) { $('pane-truth').innerHTML = '<div class="block"><div class="prose muted">尚未揭晓。</div></div>'; return; }
  const t = st.truth;
  let h = '<div class="truth-hero"><div class="truth-killer">真 凶</div>' +
    '<div class="truth-killer-name">' + esc(t.killer) + '</div></div>';
  const sec = (title, content) => '<div class="truth-section"><h4>' + title + '</h4><div class="prose">' + esc(content) + '</div></div>';
  h += sec('案情还原', t.summary);
  h += sec('动机', t.motive);
  h += sec('手法', t.method);
  h += '<div class="truth-section"><h4>时间线</h4>' +
    (t.timeline || []).map(x => '<div class="timeline-item"><span class="timeline-time">' +
      esc(String(x).split('：')[0] || '') + '</span><span class="timeline-text">' + esc(String(x).split('：').slice(1).join('：') || x) + '</span></div>').join('') + '</div>';
  h += sec('真相时刻', t.reveal);
  h += sec('复盘', t.review);
  if (st.canControl) h += '<button class="ghost-btn wide" style="margin-top:10px" onclick="UI.restart()">重开一局</button>';
  $('pane-truth').innerHTML = h;
}

// ============ 二维码 ============
function drawQR() {
  const canvas = $('qrCanvas'); if (!canvas || typeof QRCode === 'undefined') return;
  const url = baseURL() + (shareCodeParam() ? '&' : '?') + 'r=' + S.code;
  try {
    QRCode.draw(canvas, url);
  } catch (e) { console.warn('二维码生成失败', e); }
}

// ============ 交互 ============
const UI = {
  showCreate() {
    connect();
    $('createName').value = localStorage.getItem('murder_name') || '';
    this.renderCreateScripts();
    showPage('create');
  },
  showJoin() {
    connect();
    $('joinName').value = localStorage.getItem('murder_name') || '';
    const r = new URLSearchParams(location.search).get('r');
    if (r) $('joinCode').value = r.toUpperCase();
    showPage('join');
  },
  showScriptList() { this.renderScriptList(); showPage('scripts'); },
  goHome() {
    if (S.code && S.state && S.state.status !== 'ended') {
      if (!confirm('离开当前房间？你可以稍后用房间号回来。')) return;
    }
    S.code = null; S.state = null;
    localStorage.removeItem('murder_session');
    showPage('home');
  },
  renderScriptList() {
    $('scriptList').innerHTML = S.scripts.map(s =>
      '<div class="script-card"><div class="sc-top"><span class="sc-title">' + esc(s.title) +
      '</span><span class="sc-sub">' + esc(s.subtitle) + '</span></div>' +
      '<div class="sc-desc">' + esc(s.genre) + ' · 适合 ' + s.players + ' 人 · ' + esc(s.duration) + ' · 难度 ' + esc(s.difficulty) + '</div>' +
      '<div class="sc-meta"><span class="tag gold">' + s.players + ' 人本</span>' +
      '<span class="tag">' + esc(s.genre) + '</span>' +
      '<span class="tag">' + (s.killerMode === 'npc' ? '双人合作推理' : '玩家中藏凶手') + '</span>' +
      '<span class="tag">' + s.clueCount + ' 条线索</span></div></div>').join('');
  },
  renderCreateScripts() {
    if (!S.selectedScript && S.scripts.length) S.selectedScript = S.scripts[0].id;
    $('createScriptList').innerHTML = S.scripts.map(s =>
      '<button class="pick-item ' + (S.selectedScript === s.id ? 'active' : '') + '" onclick="UI.pickScript(\'' + s.id + '\')">' +
      '<span class="pi-num">' + s.players + '</span>' +
      '<span class="pi-main"><span class="pi-title">' + esc(s.title) + '</span>' +
      '<span class="pi-sub">' + esc(s.genre) + ' · ' + esc(s.duration) + '</span></span>' +
      '<span class="pi-check">✓</span></button>').join('');
  },
  pickScript(id) { S.selectedScript = id; this.renderCreateScripts(); },
  pickMode(m) {
    S.mode = m;
    document.querySelectorAll('#modeSeg .seg-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === m));
  },
  doCreate() {
    const name = $('createName').value.trim();
    if (!name) return toast('请填写昵称');
    if (!S.selectedScript) return toast('请选择剧本');
    localStorage.setItem('murder_name', name);
    connect(() => send({ type: 'create', name, scriptId: S.selectedScript, mode: S.mode }));
  },
  doJoin() {
    const name = $('joinName').value.trim();
    const code = $('joinCode').value.trim().toUpperCase();
    if (!name) return toast('请填写昵称');
    if (code.length !== 6) return toast('请输入 6 位房间号');
    localStorage.setItem('murder_name', name);
    connect(() => send({ type: 'join', name, code }));
  },
  joinAsDM() {
    connect(() => send({ type: 'joinDM', code: S.code, token: null }));
  },
  pickRole(roleId, next) {
    send({ type: 'assign', roleId: next });
  },
  autoAssign() { send({ type: 'autoAssign' }); },
  doStart() {
    const need = S.state.players.filter(p => !p.isDM).length;
    const total = S.state.script.players;
    if (need !== total) return confirm('当前只有 ' + need + '/' + total + ' 位玩家，仍要开始吗？') ? send({ type: 'start' }) : 0;
    send({ type: 'start' });
  },
  copyInvite() {
    const url = baseURL() + (shareCodeParam() ? '&' : '?') + 'r=' + S.code;
    if (navigator.clipboard) navigator.clipboard.writeText(url).then(() => toast('邀请链接已复制')).catch(() => prompt('复制这个链接：', url));
    else prompt('复制这个链接：', url);
  },
  switchTab(t) { S.tab = t; renderGame(); },
  setChatTarget(v) { S.chatTarget = v; },
  sendChat() {
    const input = $('chatInput'); if (!input) return;
    const text = input.value.trim(); if (!text) return;
    const t = $('chatTarget').value;
    if (t === '__dm_players') {
      // 主持人群发：逐条私聊
      S.state.players.filter(p => !p.isDM).forEach(p =>
        send({ type: 'chat', channel: 'private', to: p.id, text: '【主持人】' + text }));
    } else if (t === '__all') send({ type: 'chat', channel: 'public', text });
    else send({ type: 'chat', channel: 'private', to: t, text });
    input.value = '';
  },
  searchClue(id) { send({ type: 'searchClue', clueId: id }); },
  giveClue() {
    const c = $('dmClue'), p = $('dmPlayer');
    if (!c || !p) return;
    send({ type: 'giveClue', clueId: c.value, playerId: p.value });
    toast('线索已发放');
  },
  vote(i) {
    if (!confirm('确定指认：' + S.state.voting.targets[i] + '？')) return;
    send({ type: 'vote', target: i });
  },
  reveal() {
    if (!confirm('确定揭晓真相？揭晓后本局结束。')) return;
    send({ type: 'reveal' });
  },
  nextAct() { send({ type: 'nextAct' }); },
  setAct(n) { if (confirm('跳转到第 ' + n + ' 幕？')) send({ type: 'setAct', act: n }); },
  restart() { if (confirm('重开一局？所有角色和线索将重置。')) send({ type: 'restart' }); },
  closeModal() { $('modal').classList.add('hidden'); }
};

// ============ 启动 ============
async function init() {
  showPage('home');
  if (typeof SITE_CONFIG !== 'undefined' && SITE_CONFIG.scripts) {
    S.scripts = SITE_CONFIG.scripts;
    $('scriptCount').textContent = '已内置 ' + S.scripts.length + ' 套剧本 · 2–5 人';
  } else {
    try {
      const res = await fetch('/api/scripts');
      S.scripts = await res.json();
      $('scriptCount').textContent = '已内置 ' + S.scripts.length + ' 套剧本 · 2–5 人';
    } catch (e) {
      $('scriptCount').textContent = '剧本加载失败，请刷新重试';
    }
  }
  $('btnLeave').onclick = () => {
    if (!confirm('确认退出？')) return;
    if (S.code) send({ type: 'leave' });
    localStorage.removeItem('murder_session');
    S.code = null; S.state = null;
    showPage('home');
  };
  // 已有会话自动恢复
  const saved = JSON.parse(localStorage.getItem('murder_session') || 'null');
  if (saved && saved.code) resume();
}
init();

</script>
</body>
</html>
