<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>页面不存在 · 周冰红 · 产品运营 / AI 应用运营</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<style>
:root{
  --ink:#12131a; --ink-2:#3d4152; --ink-3:#6b7080; --line:#e6e7ee; --bg-2:#f5f6fa;
  --brand:#3b4fe0; --brand-2:#6c5ce7;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  background:#fff;color:var(--ink);line-height:1.7;-webkit-font-smoothing:antialiased;
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 24px;position:relative;overflow:hidden}
body::before{content:"";position:absolute;inset:0;background:
  radial-gradient(900px 420px at 78% -10%, rgba(108,92,231,.14), transparent 62%),
  radial-gradient(700px 360px at 8% 8%, rgba(59,79,224,.11), transparent 60%);
  pointer-events:none}
.box{position:relative;text-align:center;max-width:560px;width:100%}
.code{font-size:clamp(72px,16vw,124px);font-weight:800;line-height:1;letter-spacing:-.04em;
  background:linear-gradient(105deg,var(--brand) 10%,var(--brand-2) 70%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
h1{font-size:clamp(21px,4vw,27px);font-weight:700;margin-top:14px;letter-spacing:-.02em}
p{font-size:15.5px;color:var(--ink-3);margin-top:12px}
.btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:30px}
.btn{padding:12px 24px;border-radius:12px;font-size:15px;font-weight:600;text-decoration:none;
  display:inline-flex;align-items:center;gap:7px;transition:.18s}
.btn-p{background:var(--ink);color:#fff}
.btn-p:hover{transform:translateY(-2px);box-shadow:0 8px 20px -8px rgba(18,19,26,.5)}
.btn-s{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn-s:hover{border-color:var(--brand);color:var(--brand)}
.tips{margin-top:34px;padding-top:22px;border-top:1px solid var(--line);text-align:left}
.tips h2{font-size:13px;font-weight:700;color:var(--ink-2);letter-spacing:.04em;margin-bottom:12px}
.tips ul{list-style:none;display:flex;flex-direction:column;gap:9px}
.tips a{display:flex;align-items:center;gap:9px;font-size:14.5px;color:var(--ink-2);text-decoration:none;
  padding:11px 14px;border:1px solid var(--line);border-radius:11px;background:var(--bg-2);transition:.18s}
.tips a:hover{border-color:var(--brand);color:var(--brand);background:#fff;transform:translateX(3px)}
.tips a::before{content:"→";color:var(--brand);font-weight:700}
.foot{margin-top:26px;font-size:12.5px;color:var(--ink-3)}
.foot b{color:var(--ink-2)}
</style>
</head>
<body>
<div class="box">
  <div class="code">404</div>
  <h1>这个页面走丢了</h1>
  <p>链接可能已失效，或者地址拼写有误。下面几个入口应该能帮你找到要看的东西。</p>

  <div class="btns">
    <a class="btn btn-p" href="/">回到首页</a>
    <a class="btn btn-s" href="/resume.pdf" download>下载简历 PDF</a>
  </div>

  <div class="tips">
    <h2>常用入口</h2>
    <ul>
      <li><a href="/#proj">项目案例 · 4 个可复用的运营系统</a></li>
      <li><a href="/#work">作品与工具 · 3 个已上线的平台</a></li>
      <li><a href="/#exp">工作履历 · 完整经历与成果</a></li>
      <li><a href="/#contact">联系方式 · 直接发邮件</a></li>
    </ul>
  </div>

  <div class="foot"><b>周冰红</b> · 产品运营 / AI 应用运营 · 广州</div>
</div>
</body>
</html>
