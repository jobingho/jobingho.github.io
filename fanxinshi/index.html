<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>烦心事 · 英语闯关</title>
<style>
:root{
  --bg:#0b1020; --bg2:#101730; --card:#161f3d; --card2:#1d294f;
  --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.18);
  --tx:#eef2ff; --tx2:#a9b4d6; --tx3:#6f7ca8;
  --gold:#ffc861; --purple:#8b6cff; --cyan:#42e2d0; --red:#ff6b81; --green:#5ddb9a;
  --r:14px; --shadow:0 10px 34px rgba(0,0,0,.36);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--tx)}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;line-height:1.6;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
#app{min-height:100vh;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;padding:12px 16px;background:rgba(11,16,32,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.5px}
.brand .logo{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--gold),#ff8a5c);display:grid;place-items:center;color:#2a1603;font-size:18px;box-shadow:0 4px 18px rgba(255,200,97,.28)}
.brand .sub{font-size:11px;color:var(--tx3);font-weight:400;letter-spacing:1px}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:12px;color:var(--tx2)}
.pill b{color:var(--gold);font-weight:700}
.icon-btn{width:36px;height:36px;border-radius:10px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-size:16px}
.icon-btn:active{transform:scale(.94)}
main{flex:1;width:100%;max-width:880px;margin:0 auto;padding:18px 16px 110px}
.bottomnav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;z-index:60;width:min(100%,560px);display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding:8px 10px calc(10px + env(safe-area-inset-bottom));background:rgba(16,23,48,.96);backdrop-filter:blur(18px);border-top:1px solid var(--line);border-radius:18px 18px 0 0}
.nav{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:12px;color:var(--tx3);font-size:10px;transition:.18s}
.nav .ni{font-size:19px;line-height:1.1}
.nav.on{color:var(--gold);background:rgba(255,200,97,.10)}
.hero{position:relative;overflow:hidden;border-radius:20px;padding:26px 22px;background:radial-gradient(120% 140% at 85% -10%,rgba(139,108,255,.42),transparent 60%),radial-gradient(100% 120% at 0% 110%,rgba(66,226,208,.20),transparent 55%),var(--card);border:1px solid var(--line2);box-shadow:var(--shadow);margin-bottom:18px}
.hero:before{content:"";position:absolute;right:-40px;top:-50px;width:190px;height:190px;border-radius:50%;border:1px dashed rgba(255,200,97,.32)}
.hero h1{margin:0 0 6px;font-size:27px;letter-spacing:1px}
.hero p{margin:0;color:var(--tx2);font-size:13px;max-width:420px}
.hero .tag{display:inline-block;margin-top:14px;padding:5px 10px;border-radius:999px;background:rgba(255,200,97,.14);color:var(--gold);font-size:11px;border:1px solid rgba(255,200,97,.28)}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
@media(max-width:600px){.g3{grid-template-columns:repeat(2,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card.hover{transition:.18s;cursor:pointer}
.card.hover:hover{transform:translateY(-3px);border-color:var(--line2);background:var(--card2)}
.card h3{margin:0 0 6px;font-size:15px;font-weight:700}
.card .desc{color:var(--tx2);font-size:12px;margin:0}
.section-title{display:flex;align-items:center;gap:8px;margin:22px 2px 12px;font-size:15px;font-weight:700}
.section-title:before{content:"";width:4px;height:16px;border-radius:3px;background:var(--gold)}
.muted{color:var(--tx2)}.small{font-size:12px}.tiny{font-size:11px}.center{text-align:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 18px;border-radius:11px;background:var(--card2);border:1px solid var(--line2);font-weight:600;font-size:13px;transition:.16s}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,var(--gold),#ff9f5c);color:#2b1704;border-color:transparent;box-shadow:0 6px 20px rgba(255,180,90,.24)}
.btn.purple{background:linear-gradient(135deg,var(--purple),#6a4fe0);color:#fff;border-color:transparent}
.btn.ghost{background:transparent}
.btn.danger{color:#ffb3bd;border-color:rgba(255,107,129,.4);background:rgba(255,107,129,.10)}
.btn.sm{padding:7px 12px;font-size:12px;border-radius:9px}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;align-items:center;gap:10px}
.wrap{flex-wrap:wrap}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-size:22px;color:var(--gold);line-height:1.2}
.stat span{font-size:11px;color:var(--tx2)}
.level-pill{padding:8px 13px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:12px;color:var(--tx2)}
.level-pill.on{background:rgba(139,108,255,.18);border-color:rgba(139,108,255,.5);color:#c9bbff}
.progress{height:8px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.progress i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--purple),var(--cyan));transition:width .4s}
.badge{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:9px;background:rgba(139,108,255,.14);border:1px solid rgba(139,108,255,.3);font-size:11px;color:#cbbdff}
.stars{color:var(--gold);letter-spacing:2px;font-size:14px}
.scene-card{position:relative;overflow:hidden;min-height:118px}
.scene-card .ico{font-size:27px;margin-bottom:7px}
.scene-card .lv{position:absolute;right:12px;top:12px;font-size:10px;padding:3px 7px;border-radius:7px;background:rgba(255,255,255,.07);color:var(--tx2)}
.scene-card.done:after{content:"✓ 已通关";position:absolute;right:10px;bottom:10px;font-size:10px;color:var(--green)}
/* story */
.story-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.story-head .avatar{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:27px;background:var(--card2);border:1px solid var(--line2)}
.hp-wrap{flex:1}
.hp-row{display:flex;align-items:center;gap:7px;margin-bottom:5px}
.hp-row .nm{font-size:12px;color:var(--tx2);width:76px}
.hp{height:10px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;flex:1}
.hp i{display:block;height:100%;border-radius:99px;transition:width .35s;background:linear-gradient(90deg,#ff6b81,#ffc861)}
.hp.me i{background:linear-gradient(90deg,#42e2d0,#5ddb9a)}
.mission{padding:12px 14px;border-radius:12px;background:rgba(255,200,97,.08);border:1px solid rgba(255,200,97,.22);margin-bottom:14px}
.mission .mt{font-size:11px;color:var(--gold);letter-spacing:1px;margin-bottom:4px}
.bubble{max-width:86%;padding:13px 15px;border-radius:16px;margin-bottom:10px;line-height:1.55}
.bubble.npc{background:var(--card2);border:1px solid var(--line2);border-bottom-left-radius:5px}
.bubble.me{background:linear-gradient(135deg,rgba(139,108,255,.30),rgba(66,226,208,.16));border:1px solid rgba(139,108,255,.4);border-bottom-right-radius:5px;margin-left:auto}
.bubble .zh{font-size:12px;color:var(--tx2);margin-top:6px;padding-top:6px;border-top:1px dashed var(--line2)}
.bubble .emo{font-size:11px;color:var(--tx3);margin-bottom:4px}
.fix{margin:10px 0;padding:10px 12px;border-radius:11px;background:rgba(255,107,129,.08);border:1px solid rgba(255,107,129,.28);font-size:12px}
.fix .bad{color:#ff96a6;text-decoration:line-through}
.fix .good{color:var(--green);font-weight:600}
.fix .why{color:var(--tx2);margin-top:4px}
.tip{padding:10px 12px;border-radius:10px;background:rgba(66,226,208,.08);border:1px solid rgba(66,226,208,.22);font-size:12px;color:#a8f0e5;margin-top:8px}
.answer-bar{position:sticky;bottom:88px;margin-top:14px;padding:12px;background:rgba(16,23,48,.96);backdrop-filter:blur(12px);border:1px solid var(--line2);border-radius:14px}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.opt{padding:8px 12px;border-radius:9px;background:var(--card2);border:1px solid var(--line2);font-size:12px;text-align:left}
.opt:active{transform:scale(.96)}
.ans-input{width:100%;padding:12px 13px;border-radius:11px;background:rgba(255,255,255,.05);border:1px solid var(--line2);outline:none}
.ans-input:focus{border-color:var(--purple)}
.ans-row{display:flex;gap:8px;margin-top:9px}
/* pk */
.arena{position:relative;padding:20px 16px;border-radius:18px;background:radial-gradient(100% 120% at 50% -20%,rgba(139,108,255,.3),transparent 60%),var(--card);border:1px solid var(--line2);margin-bottom:14px}
.vs{display:grid;grid-template-columns:1fr 54px 1fr;align-items:center;gap:8px;text-align:center}
.vs .who{font-size:12px;color:var(--tx2);margin-top:5px}
.vs .face{font-size:34px}
.vs .mid{font-size:20px;font-weight:800;color:var(--gold)}
.timer{height:6px;border-radius:99px;background:rgba(255,255,255,.08);margin-top:16px;overflow:hidden}
.timer i{display:block;height:100%;background:var(--gold);transition:width .2s linear}
.qbox{padding:22px 18px;border-radius:16px;background:var(--card);border:1px solid var(--line2);text-align:center;margin-bottom:12px}
.qbox .q{font-size:25px;font-weight:700;letter-spacing:.5px;margin-bottom:5px}
.qbox .qc{font-size:12px;color:var(--tx2)}
.opts4{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.opt4{padding:13px 10px;border-radius:11px;background:var(--card2);border:1px solid var(--line2);font-size:13px;min-height:48px}
.opt4.right{background:rgba(93,219,154,.18);border-color:var(--green);color:#bff6d8}
.opt4.wrong{background:rgba(255,107,129,.18);border-color:var(--red);color:#ffc2cb}
/* review & words */
.wordrow{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:11px;background:var(--card2);border:1px solid var(--line);margin-bottom:8px}
.wordrow .w{font-weight:700;color:var(--gold);min-width:112px}
.wordrow .m{flex:1;color:var(--tx2);font-size:12px}
.mini-ico{width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.06);display:grid;place-items:center;font-size:14px}
.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.match-item{padding:11px 10px;border-radius:10px;background:var(--card2);border:1px solid var(--line2);font-size:12px;min-height:46px;display:flex;align-items:center}
.match-item.sel{border-color:var(--gold);background:rgba(255,200,97,.14)}
.match-item.ok{opacity:.35;pointer-events:none;border-color:var(--green)}
/* stats */
.ring{width:104px;height:104px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9}
.bars{display:flex;align-items:flex-end;gap:6px;height:110px;margin-top:12px}
.bars .b{flex:1;border-radius:6px 6px 0 0;background:linear-gradient(180deg,var(--purple),rgba(139,108,255,.22));min-height:3px;position:relative}
.bars .b span{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-size:10px;color:var(--tx3)}
/* modal / toast */
#toast{position:fixed;z-index:200;left:50%;top:76px;transform:translateX(-50%) translateY(-14px);background:#24305a;border:1px solid var(--line2);padding:10px 16px;border-radius:11px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;box-shadow:var(--shadow);max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.mask{position:fixed;inset:0;z-index:150;background:rgba(3,6,18,.78);display:grid;place-items:center;padding:18px;backdrop-filter:blur(6px)}
.modal{width:min(100%,480px);max-height:86vh;overflow:auto;background:var(--card);border:1px solid var(--line2);border-radius:18px;padding:20px;box-shadow:var(--shadow)}
.modal h2{margin:0 0 6px;font-size:18px}
.field{margin-top:13px}
.field label{display:block;font-size:12px;color:var(--tx2);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:10px 11px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid var(--line2);outline:none}
.field textarea{min-height:82px;resize:vertical}
.empty{padding:34px 16px;text-align:center;color:var(--tx3);font-size:13px}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.seg .sg{padding:7px 12px;border-radius:9px;background:var(--card2);border:1px solid var(--line);font-size:12px;color:var(--tx2)}
.seg .sg.on{background:rgba(139,108,255,.2);border-color:var(--purple);color:#d5caff}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.kv span{color:var(--tx2)}.kv b{font-weight:600}
.code{font-family:ui-monospace,Consolas,monospace;font-size:11px;color:var(--tx3);word-break:break-all}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand"><div class="logo">⚔</div><div>烦心事<div class="sub">BATTLE ENGLISH</div></div></div>
    <div class="spacer"></div>
    <div class="pill">⚡ <b id="topXp">0</b> XP</div>
    <button class="icon-btn" data-act="settings" title="设置">⚙</button>
  </header>
  <main id="view"></main>
  <nav class="bottomnav" id="nav"></nav>
</div>
<div id="toast"></div>
<div id="modalHost"></div>

<script>
/* ==================== 内置剧本数据（由已有口语工具迁移） ==================== */
const PRIMARY = [
  {
    id:'school', age:7, stage:'小学 7–10', icon:'🎒', title:'第一天上学',
    desc:'Emma 第一天去新学校，要跟老师和同学自我介绍。',
    culture:{title:'美国小学的早晨', body:'美国孩子上学第一天，老师会让学生做自我介绍。同学之间打招呼很随意，一句 Hi / Hey 就行；对老师则要礼貌，用 Hello / Good morning。称呼老师用 Ms. + 姓（如 Ms. Lopez），不直呼其名。'},
    turns:[
      {
        npc:'Ms. Lopez', npcAv:'👩‍🏫', emotion:'😊', emoHint:'老师微笑着看你，语速放慢了。',
        text:'Good morning! What’s your name?', zh:'早上好！你叫什么名字？',
        options:['I’m Emma.','My name is Emma.','Emma.'],
        nativeLine:'I’m Emma. Nice to meet you.',
        intents:[
          {keys:['i’m emma','im emma','i am emma','my name is emma','emma','i’m','my name'],
           reply:'Nice to meet you, Emma! We’re so happy you’re here.', emotion:'😊', emoHint:'老师很不客气地欢迎你。',
           zh:'很高兴认识你，Emma！我们很高兴你在这里。', quality:'ok', hint:'自我介绍时说 I’m Emma 或 My name is Emma 都对；加一句 Nice to meet you 更有礼貌，母语孩子常这么说。', aff:1, flag:'met_teacher'},
          {keys:['hi','hello','hey','good morning'],
           reply:'Hi there! And what’s your name?', emotion:'🙂', emoHint:'老师等你补上名字。',
           zh:'嗨！那你叫什么名字？', quality:'near', hint:'只说 Hi 没回答名字。老师问 What’s your name 时，要接上 I’m + 名字。', aff:0}
        ],
        fallback:{text:'Take your time. You can say “I’m Emma.”', emotion:'🙂', emoHint:'老师耐心地给你提示。', zh:'慢慢来，你可以说"I’m Emma."', quality:'miss', hint:'老师问的是名字。用 I’m + 你的名字 来回答，例如 I’m Emma。', aff:0}
      },
      {
        npc:'Ms. Lopez', npcAv:'👩‍🏫', emotion:'🙂', emoHint:'老师在点名册上写字。',
        text:'How old are you, Emma?', zh:'Emma，你几岁啦？',
        options:['I’m seven.','Seven.','I’m 7 years old.'],
        nativeLine:'I’m seven.',
        intents:[
          {keys:['i’m seven','im seven','i am seven','seven','7','seven years old','7 years old'],
           reply:'Seven! You’re in the right class then.', emotion:'😊', emoHint:'老师点点头。',
           zh:'七岁！那你来对班级了。', quality:'ok', hint:'回答年龄直接说 I’m seven. 就行。I’m 7 years old 语法没错，但日常口语里略显啰嗦。', aff:1},
          {keys:['i’m fine','good','okay','ok','i don’t know','i dont know'],
           reply:'That’s okay — you can tell me later.', emotion:'🙂', emoHint:'老师温和地说。',
           zh:'没关系，你可以待会儿告诉我。', quality:'miss', hint:'How old are you 问的是年龄，不是"你好吗"。要说 I’m + 数字。', aff:0}
        ],
        fallback:{text:'You can say “I’m seven.”', emotion:'🙂', emoHint:'老师给了提示。', zh:'你可以说"I’m seven."', quality:'miss', hint:'问年龄用 I’m + 数字回答，例如 I’m seven.', aff:0}
      },
      {
        npc:'Billy', npcAv:'👦', emotion:'😄', emoHint:'同桌男孩凑过来，语气很随意。',
        text:'Hi! Do you want to sit with me?', zh:'嗨！你想和我坐一起吗？',
        options:['Sure!','Yes, please.','Yeah, okay.'],
        nativeLine:'Sure, thanks!',
        intents:[
          {keys:['sure','yes please','yeah','okay','ok','yes','of course','i do'],
           reply:'Cool! I’m Billy. Let’s be desk partners.', emotion:'😄', emoHint:'Billy 很高兴。',
           zh:'太好了！我是 Billy，我们做同桌吧。', quality:'ok', hint:'同学之间答应邀请，Sure! / Yeah! 很自然。加一句 thanks 更有礼貌。', aff:1, flag:'friend_billy'},
          {keys:['no','not really','i don’t want','i dont want','leave me alone'],
           reply:'Oh… okay. Maybe later!', emotion:'😕', emoHint:'Billy 有点失落。',
           zh:'哦……好吧，那也许下次吧。', quality:'near', hint:'拒绝同学可以委婉一点：No thanks, maybe later. 直接说 leave me alone 会伤人。', aff:-1}
        ],
        fallback:{text:'You can just say “Sure!”', emotion:'🙂', emoHint:'Billy 等你回答。', zh:'你可以直接说"Sure!"', quality:'miss', hint:'对方在邀请你。答应就说 Sure! / Yes, please.，拒绝就说 No, thanks.', aff:0}
      },
      {
        npc:'Ms. Lopez', npcAv:'👩‍🏫', emotion:'🙂', emoHint:'老师指向你的课桌。',
        text:'Do you need help finding your desk?', zh:'需要我帮你找到座位吗？',
        options:['Yes, please.','No, thank you.','I’m okay, thanks.'],
        nativeLine:'Yes, please. Thank you!',
        intents:[
          {keys:['yes please','yes','i do','please'],
           reply:'Of course! Follow me.', emotion:'😊', emoHint:'老师在前带路。',
           zh:'当然！跟我来。', quality:'ok', hint:'接受帮助说 Yes, please. 是地道又礼貌的说法，比单说 Yes 好。', aff:1},
          {keys:['no thank you','no thanks','i’m okay','im okay','i’m fine','im fine','no'],
           reply:'All right, it’s right over there.', emotion:'🙂', emoHint:'老师指了指方向。',
           zh:'好的，就在那边。', quality:'ok', hint:'婉拒帮助说 No, thank you. / I’m okay, thanks. 都很地道。', aff:0}
        ],
        fallback:{text:'Just say “Yes, please” or “No, thank you.”', emotion:'🙂', emoHint:'老师等着。', zh:'说"Yes, please"或"No, thank you"就行。', quality:'miss', hint:'这是需要帮助的询问。用 Yes, please. 或 No, thank you. 回答。', aff:0}
      }
    ]
  },
  {
    id:'play', age:8, stage:'小学 7–10', icon:'🧸', title:'和邻居小孩玩',
    desc:'放学后，邻居家的 Timmy 来找你玩，你们要商量玩什么。',
    culture:{title:'放学后的 playdate', body:'美国孩子放学后常约邻居或同学玩，叫 playdate。邀请时很直接：Wanna play?（Want to 的口语缩略）。表达想玩什么用 Let’s… 或 How about…。如果不想玩某个游戏，通常会说 I don’t feel like it，再补一个替代建议，而不是直接拒绝。'},
    turns:[
      {
        npc:'Timmy', npcAv:'👦', emotion:'😄', emoHint:'邻居男孩抱着玩具跑过来。',

function parseBank(raw){
  const out=[];
  String(raw||'').split(';').forEach(line=>{
    line=line.trim();if(!line)return;
    const p=line.split('|');
    if(p.length<3)return;
    out.push({w:p[0].trim(),ph:p[1]||'',zh:p[2]||'',ex:p[3]||'',root:p[4]||'',conf:p[5]||''});
  });
  return out;
}

/* ==================== 本地纠错引擎 ==================== */
const GRAMMAR_RULES=[
  {re:/\bi very like\b/i,fix:'I like … very much',why:'very 不能直接修饰动词，要放在 much 前'},
  {re:/\bi am agree\b/i,fix:'I agree',why:'agree 是动词，前面不加 am'},
  {re:/\bi am know\b/i,fix:'I know',why:'know 是状态动词，不用进行时'},
  {re:/\bhow to say\b/i,fix:'how do you say',why:'疑问句需要主谓结构'},
  {re:/\bi have many homework\b/i,fix:'I have a lot of homework',why:'homework 不可数，不能用 many'},
  {re:/\bcan you tell me where is\b/i,fix:'can you tell me where … is',why:'宾语从句用陈述语序'},
  {re:/\bi’m agree\b/i,fix:'I agree',why:'agree 是动词'},
  {re:/\bhe don’t\b/i,fix:'he doesn’t',why:'第三人称单数用 doesn’t'},
  {re:/\bshe don’t\b/i,fix:'she doesn’t',why:'第三人称单数用 doesn’t'},
  {re:/\bi am interesting in\b/i,fix:'I am interested in',why:'人感到有趣用 interested'},
  {re:/\bthe most best\b/i,fix:'the best',why:'best 已经是最高级'},
  {re:/\bmore better\b/i,fix:'better',why:'better 已经是比较级'},
  {re:/\bdiscuss about\b/i,fix:'discuss',why:'discuss 是及物动词，不加 about'},
  {re:/\breturn back\b/i,fix:'return',why:'return 本身含 back 的意思'},
  {re:/\bvery much like\b/i,fix:'like … very much',why:'语序更自然'},
  {re:/\baccording to me\b/i,fix:'in my opinion',why:'according to 不用于自己的观点'}
];
function localCorrect(text,turn){
  const issues=[];
  GRAMMAR_RULES.forEach(r=>{const m=text.match(r.re);if(m)issues.push({bad:m[0],good:r.fix,why:r.why})});
  const n=norm(text);
  if(n&&n.split(' ').length<2&&turn&&turn.intents&&turn.intents.length)issues.push({bad:text.trim(),good:(turn.nativeLine||turn.options&&turn.options[0]||'').trim(),why:'单说一个词能懂，但完整句子更利于考试和职场'});
  return issues;
}

/* ==================== 意图匹配 ==================== */
function matchIntent(text,turn){
  const raw=norm(text);
  if(!raw)return null;
  const alias=raw.replace(/\b(i'm|i am|my name is)\s+[a-z]+/g,"$1 emma");
  const cand=[raw,alias];
  for(const it of (turn.intents||[])){
    for(const k of (it.keys||[])){
      const nk=norm(k);
      if(cand.some(c=>c===nk||c.includes(nk)))return it;
    }
  }
  return null;
}

/* ==================== 语音 ==================== */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null,recActive=false;
function speak(text){
  if(!S.settings.autoSpeak||!('speechSynthesis' in window))return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=S.settings.voice;u.rate=S.settings.rate;speechSynthesis.speak(u)}catch(e){}
}
function startRec(cb){
  if(!SR){toast('当前浏览器不支持语音识别，请用打字输入');return}
  if(recActive){try{rec.stop()}catch(e){}return}
  try{
    rec=new SR();rec.lang=S.settings.voice;rec.interimResults=false;rec.maxAlternatives=1;
    rec.onstart=()=>{recActive=true;toast('正在听…请开口说');$('#micBtn')&&$('#micBtn').classList.add('recording')};
    rec.onresult=e=>{const t=e.results[0][0].transcript;cb(t)};
    rec.onerror=e=>{toast(e.error==='not-allowed'?'请允许麦克风权限':'没听清，再试一次或用打字')};
    rec.onend=()=>{recActive=false;const b=$('#micBtn');if(b)b.classList.remove('recording')};
    rec.start();
  }catch(e){toast('语音启动失败，请用打字输入')}
}

/* ==================== 可选 AI 接口 ==================== */
async function aiCall(messages){
  if(!S.settings.key||!S.settings.aiOn)return null;
  try{
    const r=await fetch('https://open.bigmodel.cn/api/paas/v4/chat/completions',{
      method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+S.settings.key},
      body:JSON.stringify({model:'glm-4-flash',messages,temperature:0.6})
    });
    if(!r.ok)return null;
    const j=await r.json();return j.choices&&j.choices[0]&&j.choices[0].message.content||null;
  }catch(e){return null}
}

let P=null;
function pagePlay(){

  if(!sc)return '<div class="empty">剧本不存在</div>';

}
function playFrame(){
  const sc=P.sc,t=sc.turns[P.turn];
  const bubbles=P.log.map(x=>`<div class="bubble ${x.who}">${x.who==='npc'?`<div class="emo">${esc(x.emo||'')}</div>`:''}${esc(x.text)}${x.zh?`<div class="zh">${esc(x.zh)}</div>`:''}</div>`).join('');
  return `
  <div class="story-head">
    <button class="icon-btn" data-act="quitStory">‹</button>
    <div class="avatar">${sc.icon||'🎬'}</div>
    <div class="hp-wrap">
      <div class="hp-row"><span class="nm">${esc(t.npc)}</span><div class="hp"><i style="width:${P.nhp}%"></i></div></div>
      <div class="hp-row"><span class="nm">你</span><div class="hp me"><i style="width:${P.hp}%"></i></div></div>
    </div>
    <span class="pill">${P.turn+1}/${sc.turns.length}</span>
  </div>
  <div class="mission"><div class="mt">本轮任务</div><div>${esc(t.text)}</div><div class="small muted" style="margin-top:3px">${esc(t.emoHint||'')}</div></div>
  <div id="chat">${bubbles}<div class="bubble npc"><div class="emo">${esc(t.emotion||'')}</div>${esc(t.text)}<div class="zh">${esc(t.zh||'')}</div></div><div id="fx"></div></div>
  <div class="answer-bar" id="ansBar">
    <div class="opts">${(t.options||[]).map(o=>`<button class="opt" data-opt="${esc(o)}">${esc(o)}</button>`).join('')}</div>
    <input class="ans-input" id="ansInput" placeholder="输入你的英文回答，或点击上方提示…" autocomplete="off">
    <div class="ans-row">
      <button class="btn sm" id="micBtn" data-act="mic">🎤 说话</button>
      <button class="btn sm ghost" data-act="hintTip">提示</button>
      <div class="spacer"></div>
      <button class="btn sm primary" data-act="send">发送 ↵</button>
    </div>
  </div>`;
}
function latePlay(){
  const el=$('#ansInput');if(el){el.focus();el.onkeydown=e=>{if(e.key==='Enter')submitAnswer(el.value)}}
  const t=P.sc.turns[P.turn];speak(t.text);
}
function submitAnswer(text){
  if(!P||P.lock)return;
  text=String(text||'').trim();if(!text){toast('说点什么再发送');return}
  const t=P.sc.turns[P.turn];
  const it=matchIntent(text,t);
  const issues=localCorrect(text,t);
  const good=it&&it.quality!=='bad';
  P.tries++;
  P.log.push({who:'me',text,zh:'',emo:''});
  let fxHtml='';
  if(issues.length){
    fxHtml+=`<div class="fix"><div>🔍 <span class="bad">${esc(issues[0].bad)}</span> → <span class="good">${esc(issues[0].good)}</span></div><div class="why">${esc(issues[0].why)}</div></div>`;
    P.hp=Math.max(20,P.hp-8);
  }
  if(good){
    P.answered++;
    P.stars+=(it.quality==='ok'?1:0.6);
    P.nhp=Math.max(0,P.nhp-(it.quality==='ok'?26:16));
    P.log.push({who:'npc',text:it.reply,zh:it.zh,emo:it.emotion||''});
    speak(it.reply);
    if(it.hint)fxHtml+=`<div class="tip">💡 ${esc(it.hint)}</div>`;
    addXp(it.quality==='ok'?12:7);logDay(1);
    const bar=$('#ansBar');if(bar)bar.innerHTML='<button class="btn primary" data-act="nextTurn">继续 →</button>';
    renderChatOnly(fxHtml);
  }else{
    const fb=t.fallback||{text:'Try again — you can say “'+(t.options[0]||'')+'”',zh:'再试一次',emotion:'🙂',hint:'照着提示说一遍就好'};
    P.hp=Math.max(15,P.hp-10);
    P.log.push({who:'npc',text:fb.text,zh:fb.zh,emo:fb.emotion||''});
    speak(fb.text);
    fxHtml+=`<div class="tip">💡 ${esc(fb.hint||'再试一次，点上方提示可以直接填入')}</div>`;
    if(P.tries>=3&&!it){
      fxHtml+=`<div class="tip">已经试了 3 次，点「提示」选一句地道表达，也能通关。</div>`;
    }
    renderChatOnly(fxHtml);
    const inp=$('#ansInput');if(inp)inp.value='';
  }
  save();
  if(S.settings.key&&S.settings.aiOn)aiEnhance(text,t,it);
}
async function aiEnhance(text,turn,intent){
  const prompt=`你是英语口语 coach。学习者在情景对话中说了一句英文。\n场景：${turn.text}\n学习者说：${text}\n请用中文给出：1) 这句话是否得体自然 2) 如果有更地道的说法给出一句（英文）3) 一句话鼓励。总共不超过 90 字，直接回答。`;
  const r=await aiCall([{role:'system',content:'你是简洁的英语口语教练，用中文回答。'},{role:'user',content:prompt}]);
  if(!r)return;
  const fx=$('#fx');if(!fx)return;
  fx.insertAdjacentHTML('beforeend',`<div class="tip">🤖 AI 点评：${esc(r.replace(/\s+/g,' ').slice(0,180))}</div>`);
}
function renderChatOnly(html){
  const c=$('#chat');if(!c)return;
  c.innerHTML=P.log.map(x=>`<div class="bubble ${x.who}">${x.who==='npc'?`<div class="emo">${esc(x.emo||'')}</div>`:''}${esc(x.text)}${x.zh?`<div class="zh">${esc(x.zh)}</div>`:''}</div>`).join('')+`<div id="fx">${html||''}</div>`;
  const hpEls=document.querySelectorAll('.hp i');
  if(hpEls.length===2){hpEls[0].style.width=P.nhp+'%';hpEls[1].style.width=P.hp+'%'}
}
function nextTurn(){
  if(!P)return;
  const fx=$('#fx');if(fx&&fx.innerHTML)fx.innerHTML='';
  if(P.turn+1<P.sc.turns.length){
    P.turn++;P.tries=0;
    const t=P.sc.turns[P.turn];
    const chat=$('#chat');if(chat)chat.insertAdjacentHTML('beforeend',`<div class="bubble npc"><div class="emo">${esc(t.emotion||'')}</div>${esc(t.text)}<div class="zh">${esc(t.zh||'')}</div></div><div id="fx"></div>`);
    const hp=document.querySelectorAll('.progress i');
    const bar=$('#ansBar');
    if(bar)bar.innerHTML=`<div class="opts">${(t.options||[]).map(o=>`<button class="opt" data-opt="${esc(o)}">${esc(o)}</button>`).join('')}</div>
      <input class="ans-input" id="ansInput" placeholder="输入英文回答…" autocomplete="off">
      <div class="ans-row"><button class="btn sm" id="micBtn" data-act="mic">🎤 说话</button><button class="btn sm ghost" data-act="hintTip">提示</button><div class="spacer"></div><button class="btn sm primary" data-act="send">发送 ↵</button></div>`;
    const inp=$('#ansInput');if(inp){inp.focus();inp.onkeydown=e=>{if(e.key==='Enter')submitAnswer(inp.value)}}
    const cnt=document.querySelector('.story-head .pill');if(cnt)cnt.textContent=(P.turn+1)+'/'+P.sc.turns.length;
    const mission=document.querySelector('.mission');if(mission)mission.innerHTML=`<div class="mt">本轮任务</div><div>${esc(t.text)}</div><div class="small muted" style="margin-top:3px">${esc(t.emoHint||'')}</div>`;
    speak(t.text);
  }else{
    finishStory();
  }
}
function finishStory(){
  const total=P.sc.turns.length;
  const ratio=P.answered/total;
  const stars=Math.max(1,Math.min(3,Math.round(ratio*3-(P.tries>6?0.4:0))));
  const old=S.scenes[P.sc.id]||{stars:0};
  if(stars>old.stars)S.scenes[P.sc.id]={stars,at:Date.now()};
  S.xp+=stars*10;save();
  const view=$('#view');
  view.innerHTML=`<div class="card center" style="margin-top:40px;padding:36px 20px">
    <div style="font-size:56px">${stars===3?'🏆':stars===2?'🎖️':'🌱'}</div>
    <h2 style="margin:10px 0 4px">${stars===3?'完美通关！':stars===2?'通关成功':'艰难通关'}</h2>
    <p class="muted">${esc(P.sc.title)} · 用了 ${P.tries} 次尝试</p>
    <div class="stars" style="font-size:28px;margin:16px 0">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</div>
    <p class="small muted">获得 ${stars*10} XP · 本场景累计 ${S.scenes[P.sc.id].stars} 星</p>
    <div class="row" style="justify-content:center;margin-top:20px">
      <button class="btn primary" data-go="story">继续闯关</button>
      <button class="btn" data-act="replay">再玩一次</button>
    </div>
  </div>`;
  checkin();
}

let Q=null,pkTimer=null;
function pagePk(){
  return `
  <div class="row" style="margin-bottom:14px"><div><h2 style="margin:0;font-size:20px">单词角斗</h2><div class="small muted">和虚拟对手限时答题，输了也照样记单词</div></div></div>
  <div class="arena">
    <div class="vs">
      <div><div class="face">🦊</div><div class="who">你</div><div class="small" id="myScore">0</div></div>
      <div class="mid">VS</div>
      <div><div class="face" id="botFace">🤖</div><div class="who" id="botName">对手</div><div class="small" id="botScore">0</div></div>
    </div>
    <div class="timer"><i id="pkTime" style="width:100%"></i></div>
  </div>
  <div id="pkBody"></div>
  <div class="grid g3" style="margin-top:16px">
    <div class="card stat"><b id="statWins">${S.pk.wins}</b><span>胜场</span></div>
    <div class="card stat"><b id="statBest">${S.pk.best}</b><span>最高分</span></div>
    <div class="card stat"><b id="statPlayed">${S.pk.played}</b><span>对战次数</span></div>
  </div>`;
}
function startPkRound(){
  const names=['狂风','夜枭','闪电','铁塔','小怪兽','疾风','老鹰','石头'];
  const botNames=names[Math.floor(Math.random()*names.length)];
  const botFaces=['🤖','👾','🦁','🐺','🦅','🐲'];
  const pool=BANK[S.level].length?BANK[S.level]:BANK.beginner;
  const qs=shuffle(pool).slice(0,10).map(w=>{
    const others=shuffle(pool.filter(x=>x.w!==w.w)).slice(0,3).map(x=>x.zh);
    return {w,opts:shuffle([w.zh,...others]),ans:w.zh};
  });
  Q={qs,i:0,score:0,bot:0,botAt:2+Math.random()*3,botScore:0,botName:botNames,botFace:botFaces[Math.floor(Math.random()*botFaces.length)],t:0,locked:false};
  $('#botName').textContent=Q.botName;$('#botFace').textContent=Q.botFace;
  drawPkQ();
  clearInterval(pkTimer);
  pkTimer=setInterval(()=>{
    if(!Q||Q.locked)return;
    Q.t+=0.1;
    const left=Math.max(0,10-Q.t);
    const bar=$('#pkTime');if(bar)bar.style.width=(left*10)+'%';
    if(left<=0){answerPk(null)}
    if(Q.t>=Q.botAt){Q.bot++;Q.botAt+=2.4+Math.random()*2.2;$('#botScore').textContent=Q.bot*10}
  },100);
}
function drawPkQ(){
  const q=Q.qs[Q.i];
  $('#pkBody').innerHTML=`<div class="qbox"><div class="q">${esc(q.w.w)}</div><div class="qc">${esc(q.w.ph)} · 选出正确释义</div></div>
    <div class="opts4" id="pkOpts">${q.opts.map((o,i)=>`<button class="opt4" data-pk="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;
}
function answerPk(val){
  if(!Q||Q.locked)return;
  Q.locked=true;clearInterval(pkTimer);
  const q=Q.qs[Q.i];
  const ok=val===q.ans;
  document.querySelectorAll('#pkOpts .opt4').forEach(b=>{
    if(b.dataset.pk===q.ans)b.classList.add('right');
    else if(b.dataset.pk===val)b.classList.add('wrong');
  });
  if(ok){Q.score+=10;addXp(4)}
  else{
    const k=q.w.w;
    if(!S.wrongbook.includes(k))S.wrongbook.push(k);
    const rec=S.words[k]||{box:0,right:0,wrong:0};rec.wrong=(rec.wrong||0)+1;rec.box=0;S.words[k]=rec;save();
  }
  $('#myScore').textContent=Q.score;
  if(q.w.ex)toast((ok?'答对！':'正确答案：'+q.ans)+' · '+q.w.ex);
  setTimeout(()=>{
    Q.i++;Q.locked=false;Q.t=0;
    const bar=$('#pkTime');if(bar)bar.style.width='100%';
    if(Q.i>=Q.qs.length){endPk();return}
    drawPkQ();
    pkTimer=setInterval(()=>{
      if(!Q||Q.locked)return;
      Q.t+=0.1;const left=Math.max(0,10-Q.t);
      const b=$('#pkTime');if(b)b.style.width=(left*10)+'%';
      if(left<=0)answerPk(null);
      if(Q.t>=Q.botAt){Q.bot++;Q.botAt+=2.4+Math.random()*2.2;$('#botScore').textContent=Q.bot*10}
    },100);
  },900);
}
function endPk(){
  clearInterval(pkTimer);
  const win=Q.score>Q.bot*10;
  S.pk.played++;if(win)S.pk.wins++;else S.pk.losses++;
  S.pk.best=Math.max(S.pk.best,Q.score);save();
  $('#pkBody').innerHTML=`<div class="card center" style="margin-top:14px">
    <div style="font-size:44px">${win?'🏆':'🤝'}</div>
    <h2 style="margin:8px 0">${win?'你赢了！':'这局没赢，但单词记住了'}</h2>
    <p class="muted">你 ${Q.score} 分 · ${Q.botName} ${Q.bot*10} 分</p>
    <p class="small muted">答错的词已进错题本，输赢都不影响学习积累</p>
    <button class="btn primary" style="margin-top:14px" data-act="pkAgain">再来一局</button>
  </div>`;
  ['statWins','statBest','statPlayed'].forEach((id,i)=>{const e=document.getElementById(id);if(e)e.textContent=[S.pk.wins,S.pk.best,S.pk.played][i]});
  checkin();
}

function reviewSession(list){
  if(!list.length){toast('暂时没有需要复习的单词');return}
  R={name:'reviewCard',list,idx:0,flipped:false,right:0};render();

function pageReviewCard(){
  const it=R.list[R.idx];
  const w=typeof it==='string'?BANK[S.level].find(x=>x.w===it)||Object.values(BANK).flat().find(x=>x.w===it):it;
  if(!w)return '<div class="empty">词条不存在</div>';
  return `<div class="row"><button class="icon-btn" data-go="review">‹</button><div><h2 style="margin:0;font-size:18px">单词复习</h2><div class="small muted">${R.idx+1} / ${R.list.length}</div></div></div>

  </div>`;
}
function reviewGrade(ok){
  const it=R.list[R.idx];const k=typeof it==='string'?it:it.w;
  const r=S.words[k]||{box:0,right:0,wrong:0};
  if(ok){r.box=Math.min(5,(r.box||0)+1);r.right=(r.right||0)+1;addXp(3)}
  else{r.box=0;r.wrong=(r.wrong||0)+1}
  r.next=Date.now()+BOX_DAYS[r.box]*864e5;
  S.words[k]=r;save();
  R.idx++;R.flipped=false;
  if(R.idx>=R.list.length){
    $('#view').innerHTML=`<div class="card center" style="margin-top:40px"><div style="font-size:46px">✅</div><h2>复习完成</h2><p class="muted">本轮共 ${R.list.length} 词，记住 ${R.right} 个</p><button class="btn primary" style="margin-top:16px" data-go="review">返回复习中心</button></div>`;
  }else render();
}

/* ==================== 连连看 ==================== */
function startMatch(){
  let pool=S.vocab.slice();
  if(pool.length<6)pool=Object.keys(S.words).slice();
  if(pool.length<6)pool=shuffle(BANK[S.level]).slice(0,6).map(w=>w.w);
  pool=shuffle(pool).slice(0,6);
  const words=pool.map(k=>typeof k==='string'?BANK[S.level].find(x=>x.w===k)||Object.values(BANK).flat().find(x=>x.w===k):k).filter(Boolean);
  R={name:'match',pairs:words,left:shuffle(words.map(w=>w.w)),right:shuffle(words.map(w=>w.zh)),sel:null,done:[]};render();
}
function pageMatch(){
  return `<div class="row"><button class="icon-btn" data-go="review">‹</button><h2 style="margin:0;font-size:18px">连连看</h2><div class="spacer"></div><span class="pill">${R.done.length}/6</span></div>
  <p class="small muted">点击左侧单词，再点右侧对应释义</p>
  <div class="match-grid" style="margin-top:16px">
    <div>${R.left.map(w=>`<div class="match-item ${R.done.includes(w)?'ok':''} ${R.sel===w?'sel':''}" data-ml="${esc(w)}">${esc(w)}</div>`).join('')}</div>
    <div>${shufflePair(R).map((x,i)=>`<div class="match-item ${R.done.includes(x.w)?'ok':''}" data-mr="${esc(x.w)}">${esc(x.zh)}</div>`).join('')}</div>
  </div>
  ${R.done.length===6?'<div class="card center" style="margin-top:18px"><div style="font-size:36px">🎉</div><h3>全部配对成功</h3><button class="btn primary" data-act="matchGame">再来一局</button></div>':''}`;
}
let _pairCache={};
function shufflePair(r){
  if(!_pairCache.key||_pairCache.key!==r.pairs.map(p=>p.w).join('|')){
    _pairCache={key:r.pairs.map(p=>p.w).join('|'),arr:shuffle(r.pairs)};
  }
  return _pairCache.arr;
}
function matchClick(side,val){
  if(R.done.includes(val))return;
  if(side==='l'){R.sel=val;render();return}
  if(!R.sel){toast('先点左边的单词');return}
  if(R.sel===val){R.done.push(val);R.sel=null;addXp(2);render();if(R.done.length===6)_pairCache={}}
  else{toast('不是这个，再想想');R.sel=null;render()}
}

/* ==================== 生词本 ==================== */
function pageVocab(){
  return `<div class="row"><button class="icon-btn" data-go="me">‹</button><h2 style="margin:0;font-size:18px">生词本</h2><div class="spacer"></div><button class="btn sm" data-act="matchGame">连连看</button></div>
  <p class="small muted" style="margin-bottom:14px">对话里收藏的词，带着当时的语境一起记</p>
  ${S.vocab.length?S.vocab.map(k=>{const w=Object.values(BANK).flat().find(x=>x.w===k);return w?`<div class="wordrow"><div class="mini-ico">📌</div><div class="w">${esc(w.w)}</div><div class="m"><div>${esc(w.zh)}</div><div class="tiny">${esc(w.ex)}</div></div><button class="btn sm ghost" data-delvocab="${esc(k)}">移除</button></div>`:''}).join(''):'<div class="empty">还没有收藏生词<br>在剧情对话里点「收藏生词」就能加进来</div>'}`;
}

/* ==================== 我的 / 报告 / 设置 ==================== */
function pageMe(){
  return `<h2 style="margin:0 0 14px;font-size:20px">我的</h2>
  <div class="card"><div class="row"><div style="font-size:32px">⚔</div><div><h3 style="margin:0">烦心事 · 学习者</h3><div class="small muted">已坚持 ${S.streak} 天 · ${S.xp} XP</div></div></div></div>
  <div class="section-title">学习数据</div>
  <div class="grid g2">
    ${[['📊','学习报告','stats'],['📖','生词本','vocab'],['📚','词库管理','bank'],['⚙','设置','settings']].map(x=>`<div class="card hover" data-go="${x[2]}"><div style="font-size:22px">${x[0]}</div><h3 style="margin-top:6px">${x[1]}</h3></div>`).join('')}
  </div>
  <div class="section-title">数据管理</div>
  <div class="card">
    <div class="row wrap"><button class="btn sm" data-act="exportData">导出备份</button><button class="btn sm" data-act="importData">导入备份</button><button class="btn sm" data-act="resetData">清空数据</button></div>
    <p class="tiny muted" style="margin:10px 0 0">所有学习数据只存在这台设备的浏览器里，不会上传。</p>
  </div>`;
}
function pageStats(){
  const days=Object.keys(S.stats.days).sort().slice(-7);
  const max=Math.max(1,...days.map(d=>S.stats.days[d]));
  const done=Object.values(S.scenes).filter(x=>x.stars>0).length;
  const acc=Object.values(S.words).reduce((a,b)=>a+(b.right||0),0);
  const wrong=Object.values(S.words).reduce((a,b)=>a+(b.wrong||0),0);
  return `<div class="row"><button class="icon-btn" data-go="me">‹</button><h2 style="margin:0;font-size:18px">学习报告</h2></div>
  <div class="card center" style="margin-top:16px">
    <svg class="ring" viewBox="0 0 120 120"><circle cx="60" cy="60" r="50" stroke="rgba(255,255,255,.08)"/><circle cx="60" cy="60" r="50" stroke="#ffc861" stroke-dasharray="${Math.min(314,314*done/Math.max(1,allScenes().length))} 314" stroke-linecap="round"/></svg>
    <div style="margin-top:-74px;margin-bottom:46px"><b style="font-size:22px;color:var(--gold)">${done}</b><div class="tiny muted">已通关场景</div></div>
    <div class="grid g3" style="text-align:left">
      <div class="stat"><b>${S.xp}</b><span>总经验</span></div>
      <div class="stat"><b>${S.streak}</b><span>连续天数</span></div>
      <div class="stat"><b>${S.pk.played?Math.round(S.pk.wins/S.pk.played*100):0}%</b><span>对战胜率</span></div>
    </div>
  </div>
  <div class="card" style="margin-top:12px"><h3>近 7 天学习时长</h3><div class="bars">${days.map(d=>`<div class="b" style="height:${Math.max(3,S.stats.days[d]/max*100)}%"><span>${d.slice(5)}</span></div>`).join('')||'<div class="muted small">暂无记录</div>'}</div><div style="height:20px"></div></div>
  <div class="card" style="margin-top:12px"><h3>答题表现</h3><div class="kv"><span>累计答对</span><b style="color:var(--green)">${acc}</b></div><div class="kv"><span>累计答错</span><b style="color:var(--red)">${wrong}</b></div><div class="kv"><span>正确率</span><b>${acc+wrong?Math.round(acc/(acc+wrong)*100):0}%</b></div></div>`;
}
function pageSettings(){
  return `<div class="row"><button class="icon-btn" data-go="me">‹</button><h2 style="margin:0;font-size:18px">设置</h2></div>
  <div class="card" style="margin-top:16px">
    <h3>AI 增强（可选）</h3>
    <p class="small muted">不填也能玩：剧情和纠错走内置规则，完全离线。填入智谱 GLM-4-flash 的 Key 后，可解锁自由追问和更细的纠错。</p>
    <div class="field"><label>智谱 API Key</label><input id="setKey" type="password" value="${esc(S.settings.key)}" placeholder="留空则使用本地智能模式"></div>
    <div class="field"><label><input type="checkbox" id="setAiOn" ${S.settings.aiOn?'checked':''} style="width:auto"> 启用 AI 增强</label></div>
  </div>
  <div class="card" style="margin-top:12px">
    <h3>语音</h3>
    <div class="field"><label>NPC 口音</label><select id="setVoice"><option value="en-US" ${S.settings.voice==='en-US'?'selected':''}>美音 en-US</option><option value="en-GB" ${S.settings.voice==='en-GB'?'selected':''}>英音 en-GB</option></select></div>
    <div class="field"><label>语速 <span id="rateVal">${S.settings.rate}</span></label><input id="setRate" type="range" min="0.6" max="1.3" step="0.05" value="${S.settings.rate}"></div>
    <div class="field"><label><input type="checkbox" id="setAutoSpeak" ${S.settings.autoSpeak?'checked':''} style="width:auto"> NPC 自动朗读</label></div>
  </div>
  <button class="btn primary" style="width:100%;margin-top:16px" data-act="saveSettings">保存设置</button>
  <p class="tiny muted" style="margin-top:12px">当前模式：${S.settings.key&&S.settings.aiOn?'AI 增强已开启':'本地智能模式（无需 Key）'}</p>`;
}
function pageBank(){
  const list=BANK[S.level];
  return `<div class="row"><button class="icon-btn" data-go="me">‹</button><h2 style="margin:0;font-size:18px">词库管理</h2><div class="spacer"></div><button class="btn sm" data-act="addWord">+ 新增</button></div>
  <div class="seg" style="margin-top:12px">${LEVELS.map(l=>`<button class="sg ${S.level===l.k?'on':''}" data-level="${l.k}">${l.n}</button>`).join('')}</div>
  <p class="small muted">当前 ${list.length} 词 · 内置词库可在界面增补，导入格式为 JSON 数组</p>
  <button class="btn sm" data-act="importWords" style="margin-bottom:12px">导入词库 JSON</button>
  ${list.map((w,i)=>`<div class="wordrow"><div class="mini-ico">${i+1}</div><div class="w">${esc(w.w)}</div><div class="m">${esc(w.zh)}</div><button class="btn sm ghost" data-editword="${i}">编辑</button></div>`).join('')}`;
}

/* ==================== 事件 ==================== */
document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-go],[data-act],[data-level],[data-scene],[data-opt],[data-pk],[data-ml],[data-mr],[data-delvocab],[data-editword]');
  if(!t)return;
  if(t.dataset.go){go({name:t.dataset.go});return}
  if(t.dataset.level){S.level=t.dataset.level;save();render();return}
  if(t.dataset.scene){go({name:'play',id:t.dataset.scene});return}
  if(t.dataset.opt){const i=$('#ansInput');if(i){i.value=t.dataset.opt;i.focus()}return}
  if(t.dataset.pk){answerPk(t.dataset.pk);return}
  if(t.dataset.ml){matchClick('l',t.dataset.ml);return}
  if(t.dataset.mr){matchClick('r',t.dataset.mr);return}
  if(t.dataset.delvocab){S.vocab=S.vocab.filter(x=>x!==t.dataset.delvocab);save();render();return}
  if(t.dataset.editword){editWord(parseInt(t.dataset.editword));return}
  const a=t.dataset.act;
  switch(a){
    case 'settings':go({name:'settings'});break;
    case 'quitStory':go({name:'story'});break;
    case 'replay':go({name:'play',id:P.sc.id});break;
    case 'send':submitAnswer($('#ansInput').value);break;
    case 'mic':startRec(text=>{const i=$('#ansInput');if(i){i.value=text;submitAnswer(text)}});break;
    case 'nextTurn':nextTurn();break;
    case 'hintTip':{
      const cur=P&&P.sc.turns[P.turn];if(!cur)break;
      const i=$('#ansInput');if(i){i.value=cur.nativeLine||cur.options[0];i.focus()}
      toast('已填入一句地道表达，可以直接发送');break;
    }
    case 'collectWord':break;
    case 'pkAgain':go({name:'pk',live:1});break;
    case 'reviewDue':reviewSession(dueWords());break;
    case 'reviewWrong':reviewSession(S.wrongbook.slice());break;
    case 'matchGame':startMatch();break;
    case 'flipCard':R.flipped=true;render();break;
    case 'reviewYes':reviewGrade(true);break;
    case 'reviewNo':reviewGrade(false);break;
    case 'saveSettings':{
      S.settings.key=$('#setKey').value.trim();
      S.settings.aiOn=$('#setAiOn').checked;
      S.settings.voice=$('#setVoice').value;
      S.settings.rate=parseFloat($('#setRate').value);
      S.settings.autoSpeak=$('#setAutoSpeak').checked;
      save();toast('设置已保存');go({name:'me'});break;
    }
    case 'exportData':{
      const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
      const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='烦心事-备份-'+today()+'.json';a.click();
      toast('备份已下载');break;
    }
    case 'importData':{
      const inp=document.createElement('input');inp.type='file';inp.accept='.json';
      inp.onchange=()=>{const f=inp.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const d=JSON.parse(rd.result);if(!d||typeof d!=='object')throw 0;S=Object.assign(DEF(),d);save();toast('导入成功');go({name:'home'})}catch(e){toast('文件格式不对')}};rd.readAsText(f)};
      inp.click();break;
    }
    case 'resetData':{
      if(confirm('确定清空所有学习数据？此操作不可恢复。')){S=DEF();save();toast('已清空');go({name:'home'})}break;
    }
    case 'addWord':{
      $('#modalHost').innerHTML=`<div class="mask"><div class="modal"><h2>新增词条</h2><div class="field"><label>单词</label><input id="nw_w"></div><div class="field"><label>音标</label><input id="nw_ph"></div><div class="field"><label>释义</label><input id="nw_zh"></div><div class="field"><label>例句</label><input id="nw_ex"></div><div class="row" style="margin-top:16px"><button class="btn ghost" data-act="closeModal">取消</button><div class="spacer"></div><button class="btn primary" data-act="saveNewWord">保存</button></div></div></div>`;break;
    }
    case 'saveNewWord':{
      const w=$('#nw_w').value.trim();if(!w){toast('请填单词');break}
      BANK[S.level].unshift({w,ph:$('#nw_ph').value.trim(),zh:$('#nw_zh').value.trim(),ex:$('#nw_ex').value.trim(),root:'',conf:''});
      $('#modalHost').innerHTML='';render();toast('已添加');break;
    }
    case 'importWords':{
      const inp=document.createElement('input');inp.type='file';inp.accept='.json';
      inp.onchange=()=>{const f=inp.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const arr=JSON.parse(rd.result);if(!Array.isArray(arr))throw 0;arr.forEach(w=>{if(w&&w.w)BANK[S.level].push({w:w.w,ph:w.ph||'',zh:w.zh||'',ex:w.ex||'',root:w.root||'',conf:w.conf||''})});toast('导入 '+arr.length+' 词');render()}catch(e){toast('文件格式不对')}};rd.readAsText(f)};
      inp.click();break;
    }
    case 'closeModal':$('#modalHost').innerHTML='';break;
  }
});
function editWord(i){
  const w=BANK[S.level][i];if(!w)return;
  $('#modalHost').innerHTML=`<div class="mask"><div class="modal"><h2>编辑词条</h2>
    <div class="field"><label>单词</label><input id="ew_w" value="${esc(w.w)}"></div>
    <div class="field"><label>音标</label><input id="ew_ph" value="${esc(w.ph)}"></div>
    <div class="field"><label>释义</label><input id="ew_zh" value="${esc(w.zh)}"></div>
    <div class="field"><label>例句</label><input id="ew_ex" value="${esc(w.ex)}"></div>
    <div class="row" style="margin-top:16px"><button class="btn danger" data-act="delWord" data-i="${i}">删除</button><div class="spacer"></div><button class="btn ghost" data-act="closeModal">取消</button><button class="btn primary" data-act="saveWord" data-i="${i}">保存</button></div>
  </div></div>`;
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act="saveWord"],[data-act="delWord"]');if(!t)return;
  const i=+t.dataset.i;
  if(t.dataset.act==='saveWord'){
    BANK[S.level][i]={w:$('#ew_w').value.trim(),ph:$('#ew_ph').value.trim(),zh:$('#ew_zh').value.trim(),ex:$('#ew_ex').value.trim(),root:BANK[S.level][i].root||'',conf:BANK[S.level][i].conf||''};
    $('#modalHost').innerHTML='';render();toast('已保存');
  }else{
    if(confirm('删除这个词条？')){BANK[S.level].splice(i,1);$('#modalHost').innerHTML='';render();toast('已删除')}
  }
});
document.addEventListener('input',e=>{if(e.target.id==='setRate'){const v=$('#rateVal');if(v)v.textContent=e.target.value}});

/* ==================== 启动 ==================== */
render();
</script>
</body>
</html>
