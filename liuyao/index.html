<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>六爻占卜 · 一事一卦</title>
<style>
  :root{
    --paper:#f2e9d8; --paper2:#faf4e6; --card:#fbf6ea;
    --ink:#2b2620; --ink2:#6b5f4b; --ink3:#9a8a70;
    --cinnabar:#a32d2d; --cinnabar2:#8b2222;
    --line:#d9c9a8; --line2:#cbb68f;
    --gold:#b08d3f;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper); color:var(--ink);
    font-family:"Kaiti SC","STKaiti","KaiTi","Songti SC","SimSun",serif;
    line-height:1.7; -webkit-font-smoothing:antialiased;
    background-image:
      radial-gradient(circle at 12% 18%, rgba(176,141,63,.05) 0, transparent 40%),
      radial-gradient(circle at 88% 72%, rgba(163,45,45,.04) 0, transparent 45%);
  }
  .wrap{max-width:720px;margin:0 auto;padding:22px 16px 60px}
  header{text-align:center;margin-bottom:20px;position:relative}
  h1{font-size:30px;letter-spacing:8px;margin:0;font-weight:400;color:var(--ink)}
  .sub{font-size:13px;color:var(--ink3);letter-spacing:4px;margin-top:6px}
  .seal{display:inline-block;border:2px solid var(--cinnabar);color:var(--cinnabar);
    font-size:12px;padding:2px 8px;border-radius:4px;letter-spacing:2px;margin-top:10px;
    transform:rotate(-3deg)}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:10px;
    padding:20px;box-shadow:0 2px 10px rgba(90,70,40,.06);margin-bottom:18px}
  .label{font-size:15px;color:var(--ink2);margin-bottom:8px;letter-spacing:1px}
  input[type=text]{width:100%;font-size:16px;font-family:inherit;color:var(--ink);
    background:var(--paper2);border:1px solid var(--line2);border-radius:8px;
    padding:12px 14px;outline:none}
  input[type=text]:focus{border-color:var(--cinnabar);box-shadow:0 0 0 3px rgba(163,45,45,.08)}
  .btn{display:block;width:100%;font-family:inherit;font-size:18px;letter-spacing:4px;
    color:#fff8ec;background:var(--cinnabar);border:none;border-radius:8px;
    padding:14px;margin-top:14px;cursor:pointer;transition:.2s}
  .btn:hover{background:var(--cinnabar2)}
  .btn:active{transform:scale(.985)}
  .btn:disabled{background:var(--ink3);cursor:not-allowed}

  .stage{margin-top:6px}
  .stage-hint{text-align:center;color:var(--ink3);font-size:14px;letter-spacing:2px;
    min-height:26px;margin-bottom:8px}
  .yao-col{display:flex;flex-direction:column-reverse;gap:9px;align-items:center;margin:14px 0}
  .yao-row{display:flex;align-items:center;gap:12px;height:26px;opacity:0;transform:translateY(-14px);
    transition:opacity .35s,transform .35s}
  .yao-row.show{opacity:1;transform:translateY(0)}
  .yao-name{font-size:13px;color:var(--ink3);width:46px;text-align:right}
  .yao-name.mov{color:var(--cinnabar)}
  .yao-bar{display:flex;gap:8px;width:120px;justify-content:center}
  .seg{height:11px;background:var(--ink);border-radius:2px;width:52px}
  .yao-row.moving .seg{background:var(--cinnabar)}
  .yao-mark{font-size:13px;width:26px;color:var(--cinnabar)}
  .coins{display:flex;gap:10px;justify-content:center;height:44px;align-items:center}
  .coin{width:32px;height:32px;border-radius:50%;background:#d9c189;border:2px solid var(--gold);
    position:relative;display:flex;align-items:center;justify-content:center;
    font-size:16px;color:#6e5620}
  .coin::after{content:"";position:absolute;width:9px;height:9px;background:var(--paper);
    border-radius:2px}
  .coin.spin{animation:flip .45s linear}
  @keyframes flip{0%{transform:rotateY(0)}100%{transform:rotateY(720deg)}}

  .result-head{text-align:center;border-top:1px dashed var(--line2);padding-top:18px;margin-top:4px}
  .gua-pair{font-size:22px;letter-spacing:2px;color:var(--ink)}
  .gua-pair .arrow{color:var(--cinnabar);margin:0 10px;font-size:18px}
  .gua-pair .bian{color:var(--ink2)}
  .tag{display:inline-block;font-size:12px;padding:3px 10px;border-radius:20px;
    margin:8px 4px 0;letter-spacing:1px}
  .tag.ben{background:#efe6d2;color:var(--ink2)}
  .tag.bian{background:#f6e4d8;color:#8a4a22}

  .sec{margin-top:16px}
  .sec-t{font-size:15px;color:var(--cinnabar);letter-spacing:2px;
    border-left:3px solid var(--cinnabar);padding-left:9px;margin-bottom:8px}
  .txt{font-size:15px;color:var(--ink);line-height:1.85}
  .txt .yuan{color:var(--ink2)}
  .line-item{padding:8px 0;border-bottom:1px dotted var(--line);font-size:14px}
  .line-item:last-child{border-bottom:none}
  .line-item .lt{color:var(--ink)}
  .line-item .lb{color:var(--ink2);font-size:13px;display:block;margin-top:2px}
  .badge{font-size:11px;padding:1px 7px;border-radius:10px;margin-left:6px}
  .badge.ji{background:#f6dcdc;color:#a32d2d}
  .badge.ping{background:#eee7d6;color:#7a6c52}
  .badge.xiong{background:#dfe9df;color:#3c6b4a}
  .verdict{background:linear-gradient(180deg,#f7ecd8,#f3e4cc);border:1px solid var(--line2);
    border-radius:8px;padding:16px;margin-top:16px}
  .verdict .lv{font-size:26px;letter-spacing:6px;text-align:center;color:var(--cinnabar)}
  .verdict .vt{font-size:15px;text-align:center;margin:8px 0 12px;color:var(--ink)}
  .verdict .vb{font-size:14px;line-height:1.9;color:var(--ink2)}
  .verdict .basis{font-size:12px;color:var(--ink3);margin-top:10px;padding-top:10px;
    border-top:1px dotted var(--line2);line-height:1.7}

  .toolbar{display:flex;gap:10px;margin-top:14px}
  .toolbar .btn{margin-top:0;font-size:15px;letter-spacing:2px;padding:12px}
  .btn.ghost{background:transparent;color:var(--cinnabar);border:1px solid var(--cinnabar)}

  .hist-mask{display:none;position:fixed;inset:0;background:rgba(43,38,32,.5);z-index:50}
  .hist-mask.open{display:block}
  .hist{position:absolute;right:0;top:0;bottom:0;width:min(400px,92vw);background:var(--paper2);
    box-shadow:-4px 0 20px rgba(0,0,0,.15);overflow-y:auto;padding:20px 18px}
  .hist h3{margin:0 0 16px;font-weight:400;font-size:20px;letter-spacing:3px;color:var(--ink)}
  .hist .close{position:absolute;right:16px;top:16px;background:none;border:none;
    font-size:24px;color:var(--ink2);cursor:pointer;line-height:1}
  .hitem{background:var(--card);border:1px solid var(--line);border-radius:8px;
    padding:12px 14px;margin-bottom:10px;cursor:pointer}
  .hitem .hq{font-size:15px;color:var(--ink);margin-bottom:4px}
  .hitem .hm{font-size:12px;color:var(--ink3)}
  .hitem .hd{display:none;margin-top:10px;padding-top:10px;border-top:1px dotted var(--line2);
    font-size:13px;color:var(--ink2);line-height:1.8}
  .hitem.open .hd{display:block}
  .hdel{float:right;font-size:12px;color:var(--cinnabar);background:none;border:none;cursor:pointer}
  .empty{text-align:center;color:var(--ink3);padding:40px 10px;font-size:14px}
  .clear{width:100%;margin-top:10px;background:none;border:1px solid var(--line2);
    color:var(--ink2);font-family:inherit;padding:10px;border-radius:8px;cursor:pointer;font-size:14px}
  footer{text-align:center;color:var(--ink3);font-size:12px;margin-top:30px;letter-spacing:1px}
  @media(max-width:480px){h1{font-size:26px}.panel{padding:16px}.wrap{padding:18px 12px 50px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>六爻占卜</h1>
    <div class="sub">一事一卦 · 诚则灵</div>
    <div class="seal">金钱卦</div>
  </header>

  <div class="panel">
    <div class="label">所占之事</div>
    <input id="question" type="text" maxlength="80" placeholder="请输入你想问的那件事……">
    <button class="btn" id="castBtn">摇 卦 起 占</button>
  </div>

  <div class="panel stage" id="stage" style="display:none">
    <div class="stage-hint" id="stageHint">静心默念所占之事……</div>
    <div class="coins" id="coins" style="display:none">
      <div class="coin"></div><div class="coin"></div><div class="coin"></div>
    </div>
    <div class="yao-col" id="yaoCol"></div>
  </div>

  <div class="panel" id="result" style="display:none">
    <div class="result-head">
      <div class="gua-pair"><span id="benName">本卦</span><span class="arrow">➜</span><span class="bian" id="bianName">变卦</span></div>
      <div><span class="tag ben" id="benTag"></span><span class="tag bian" id="bianTag"></span></div>
    </div>

    <div class="sec">
      <div class="sec-t">卦辞</div>
      <div class="txt"><span class="yuan" id="guaCi"></span><br><span id="guaBai"></span></div>
    </div>

    <div class="sec" id="movingSec">
      <div class="sec-t">动爻</div>
      <div id="movingList"></div>
    </div>

    <div class="sec">
      <div class="sec-t">变卦</div>
      <div class="txt" id="bianTxt"></div>
    </div>

    <div class="verdict">
      <div class="lv" id="verdictLv">吉</div>
      <div class="vt" id="verdictTitle"></div>
      <div class="vb" id="verdictBody"></div>
      <div class="basis" id="verdictBasis"></div>
    </div>

    <div class="toolbar">
      <button class="btn ghost" id="againBtn">再占一卦</button>
      <button class="btn ghost" id="histBtn">历史记录</button>
    </div>
  </div>

  <footer>卦者，时也；占者，断也。仅供参考，取舍在人。</footer>
</div>

<div class="hist-mask" id="histMask">
  <div class="hist">
    <button class="close" id="histClose">×</button>
    <h3>历史记录</h3>
    <div id="histList"></div>
    <button class="clear" id="histClear">清空全部记录</button>
  </div>
</div>

<script>
const GUA64 = [
  {
    n: 1,
    name: "乾为天",
    guaCi: "元亨利贞",
    guaBai: "大为亨通，利于坚守正道。",
    meaning: "刚健进取，自强不息",
    rating: "吉",
    lines: [
      { t: "初九：潜龙勿用", b: "龙潜伏水下，暂不施展才用，宜静待时机。", r: "平" },
      { t: "九二：见龙在田，利见大人", b: "龙出现于田野，利于拜见有德之人。", r: "吉" },
      { t: "九三：君子终日乾乾，夕惕若厉，无咎", b: "君子终日勤奋不懈，夜晚仍警惕，虽有危险终无灾祸。", r: "平" },
      { t: "九四：或跃在渊，无咎", b: "或跃上天，或退处深渊，审时度势则无灾祸。", r: "平" },
      { t: "九五：飞龙在天，利见大人", b: "龙高飞上天，大展宏图，利于见有德之人。", r: "吉" },
      { t: "上九：亢龙有悔", b: "龙飞过高，进退失据，必有悔恨。", r: "凶" }
    ]
  },
  {
    n: 2,
    name: "坤为地",
    guaCi: "元亨，利牝马之贞。君子有攸往，先迷后得主，利。西南得朋，东北丧朋。安贞，吉。",
    guaBai: "大为亨通，利守正。先迷惑后得主，安于正道则吉。",
    meaning: "柔顺包容，厚德载物",
    rating: "吉",
    lines: [
      { t: "初六：履霜，坚冰至", b: "脚下踩到霜，预示严寒将至，宜早作防范。", r: "平" },
      { t: "六二：直方大，不习无不利", b: "正直端方宏大，不假修习也无不利。", r: "吉" },
      { t: "六三：含章可贞，或从王事，无成有终", b: "内含文采可守正，辅佐王事，不居功而有终。", r: "平" },
      { t: "六四：括囊，无咎无誉", b: "如扎紧口袋般谨慎缄默，无灾祸也无赞誉。", r: "平" },
      { t: "六五：黄裳，元吉", b: "穿黄色下裳，居中守正，大为吉祥。", r: "吉" },
      { t: "上六：龙战于野，其血玄黄", b: "龙交战于田野，两败俱伤，血流玄黄。", r: "凶" }
    ]
  },
  {
    n: 3,
    name: "水雷屯",
    guaCi: "元亨利贞，勿用有攸往，利建侯。",
    guaBai: "初始艰难，宜守正并建立基业，不宜轻举妄动。",
    meaning: "初生艰难，积蓄待时",
    rating: "平",
    lines: [
      { t: "初九：磐桓，利居贞，利建侯", b: "徘徊难进，宜安居守正，利于建立侯业。", r: "平" },
      { t: "六二：屯如邅如，乘马班如。匪寇婚媾，女子贞不字，十年乃字", b: "艰难徘徊，非寇乃求婚，女子守正久后乃许。", r: "平" },
      { t: "六三：即鹿无虞，惟入于林中，君子几不如舍，往吝", b: "无向导而逐鹿入林，宜舍弃，前往必有憾。", r: "凶" },
      { t: "六四：乘马班如，求婚媾，往吉，无不利", b: "乘马徘徊以求和亲，前往吉祥无不利。", r: "吉" },
      { t: "九五：屯其膏，小贞吉，大贞凶", b: "恩泽未能广施，小事守正吉，大事则凶。", r: "平" },
      { t: "上六：乘马班如，泣血涟如", b: "进退维谷，泣血涟涟，处境十分悲伤。", r: "凶" }
    ]
  },
  {
    n: 4,
    name: "山水蒙",
    guaCi: "亨。匪我求童蒙，童蒙求我。初筮告，再三渎，渎则不告。利贞。",
    guaBai: "启蒙亨通，童蒙诚心求教则告，宜守正。",
    meaning: "启蒙教化，虚心求教",
    rating: "平",
    lines: [
      { t: "初六：发蒙，利用刑人，用说桎梏，以往吝", b: "启发蒙昧宜立规范，放任前往则有憾。", r: "平" },
      { t: "九二：包蒙吉，纳妇吉，子克家", b: "包容蒙昧吉祥，纳妇吉祥，子能治家。", r: "吉" },
      { t: "六三：勿用取女，见金夫，不有躬，无攸利", b: "勿娶此女，见利而失身，无所利。", r: "凶" },
      { t: "六四：困蒙，吝", b: "困于蒙昧，远离明师，必有遗憾。", r: "凶" },
      { t: "六五：童蒙，吉", b: "如童蒙般虚心求教，吉祥。", r: "吉" },
      { t: "上九：击蒙，不利为寇，利御寇", b: "击破蒙昧，不宜为寇作乱，宜抵御外寇。", r: "平" }
    ]
  },
  {
    n: 5,
    name: "水天需",
    guaCi: "有孚，光亨，贞吉。利涉大川。",
    guaBai: "心怀诚信则光明亨通，守正吉祥，利于涉险。",
    meaning: "等待时机，诚信待时",
    rating: "吉",
    lines: [
      { t: "初九：需于郊，利用恒，无咎", b: "在郊外等待，持之以恒，可无灾祸。", r: "平" },
      { t: "九二：需于沙，小有言，终吉", b: "近水沙滩处等待，略有言语中伤，终归吉祥。", r: "吉" },
      { t: "九三：需于泥，致寇至", b: "陷于泥泞中等待，易招致寇盗之祸。", r: "凶" },
      { t: "六四：需于血，出自穴", b: "于险境血泊中等待，终能脱离洞穴。", r: "平" },
      { t: "九五：需于酒食，贞吉", b: "安于酒食以待时，守正吉祥。", r: "吉" },
      { t: "上六：入于穴，有不速之客三人来，敬之终吉", b: "有不速之客三人来访，恭敬相待终得吉祥。", r: "吉" }
    ]
  },
  {
    n: 6,
    name: "天水讼",
    guaCi: "有孚窒惕，中吉，终凶。利见大人，不利涉大川。",
    guaBai: "争讼宜止，中途而止则吉，争执到底则凶。",
    meaning: "争讼是非，止讼为要",
    rating: "凶",
    lines: [
      { t: "初六：不永所事，小有言，终吉", b: "不长久纠缠争讼，略受非议，终归吉祥。", r: "平" },
      { t: "九二：不克讼，归而逋，其邑人三百户，无眚", b: "争讼不胜，逃归故里，可免灾祸。", r: "平" },
      { t: "六三：食旧德，贞厉，终吉。或从王事，无成", b: "安享旧德，守正防危，终吉；从王事不居功。", r: "平" },
      { t: "九四：不克讼，复即命，渝安贞，吉", b: "争讼不胜，回归正理，改变而守正，吉祥。", r: "吉" },
      { t: "九五：讼元吉", b: "争讼得公正裁决，大为吉祥。", r: "吉" },
      { t: "上九：或锡之鞶带，终朝三褫之", b: "虽受赏赐鞶带，一日内屡被剥夺，不可久恃。", r: "凶" }
    ]
  },
  {
    n: 7,
    name: "地水师",
    guaCi: "贞，丈人吉，无咎。",
    guaBai: "守正，由德高望重的长者统帅则吉祥无灾。",
    meaning: "兴师动众，纪律严明",
    rating: "平",
    lines: [
      { t: "初六：师出以律，否臧凶", b: "出兵须纪律严明，纪律不善则凶。", r: "凶" },
      { t: "九二：在师中，吉无咎，王三锡命", b: "统帅军中得中道，吉祥无灾，屡受王命嘉奖。", r: "吉" },
      { t: "六三：师或舆尸，凶", b: "用人不当，载尸而归，凶险。", r: "凶" },
      { t: "六四：师左次，无咎", b: "退兵驻守，审时度势，可无灾祸。", r: "平" },
      { t: "六五：田有禽，利执言，无咎。长子帅师，弟子舆尸，贞凶", b: "有敌来犯利讨伐；任人不当载尸归，守正亦凶。", r: "平" },
      { t: "上六：大君有命，开国承家，小人勿用", b: "论功行赏，开国承家，切勿任用小人。", r: "平" }
    ]
  },
  {
    n: 8,
    name: "水地比",
    guaCi: "吉。原筮元永贞，无咎。不宁方来，后夫凶。",
    guaBai: "亲比吉利，元永守正无灾，迟疑后来者凶。",
    meaning: "亲比团结，择善而从",
    rating: "吉",
    lines: [
      { t: "初六：有孚比之，无咎。有孚盈缶，终来有它吉", b: "以诚信亲比，无灾；诚信充盈，终有意外之吉。", r: "吉" },
      { t: "六二：比之自内，贞吉", b: "发自内心地亲比，守正吉祥。", r: "吉" },
      { t: "六三：比之匪人", b: "所亲比者非其人，交往不当。", r: "凶" },

/* ============ 八卦编码与查表 ============ */
var GUA_CODE={'乾':7,'兑':3,'离':5,'震':1,'巽':6,'坎':2,'艮':4,'坤':0,
             '天':7,'泽':3,'火':5,'雷':1,'风':6,'水':2,'山':4,'地':0};
var CODE_NAME={7:'乾',3:'兑',5:'离',1:'震',6:'巽',2:'坎',4:'艮',0:'坤'};
var YAO_POS=['初','二','三','四','五','上'];
var byKey=new Array(64);
GUA64.forEach(function(g){
  var nm=g.name;
  if(nm.charAt(1)==='为'){g.up=GUA_CODE[nm.charAt(0)];g.down=g.up;}
  else{g.up=GUA_CODE[nm.charAt(0)];g.down=GUA_CODE[nm.charAt(1)];}
  byKey[g.up*8+g.down]=g;
});

function guaByYao(yao){
  var down=yao[0]*1+yao[1]*2+yao[2]*4;
  var up=yao[3]*1+yao[4]*2+yao[5]*4;
  return byKey[up*8+down];
}
function yaoSymbol(yang,moving){
  return yang?(moving?'九':'阳'):(moving?'六':'阴');
}

/* ============ 起卦 ============ */
function throwOne(){
  var c=[Math.random()<0.5?3:2, Math.random()<0.5?3:2, Math.random()<0.5?3:2];
  var s=c[0]+c[1]+c[2];
  return {coins:c, val:s, yang:(s===9||s===7), moving:(s===9||s===6)};
}
function castSix(){var a=[];for(var i=0;i<6;i++)a.push(throwOne());return a;}

/* ============ 综合判断规则引擎 ============ */
var SCORE={'吉':1,'平':0,'凶':-1};
function judge(ben,bian,movingIdx,throws){
  var s=SCORE[ben.rating]*1 + SCORE[bian.rating]*1.5;
  movingIdx.forEach(function(i){ s+=SCORE[ben.lines[i].r]*1; });
  var n=movingIdx.length;
  var avg=s/(2.5+n);
  var lv,title,advice;
  if(avg>=0.5){lv='大吉';title='卦象显示此事宜行，趋势向好。';
    advice='时机与条件较为有利，宜把握机会、主动推进，顺势而为可望顺遂。';}
  else if(avg>=0.15){lv='偏吉';title='卦象总体偏向有利，但过程中有波折。';
    advice='大方向可行，唯需留意中途变数，稳中求进、审时度势为佳。';}
  else if(avg>-0.15){lv='平';title='卦象显示趋势平稳，宜守不宜激进。';
    advice='当前无明显利弊，宜维持现状、谨慎观察，待局势更明朗再作决断。';}
  else if(avg>-0.5){lv='偏凶';title='卦象总体偏向不利，需防生变。';
    advice='阻碍与风险偏多，宜暂缓推进、保守为上，不宜贸然行动。';}
  else{lv='凶';title='卦象显示此事宜止不宜行，趋势不利。';
    advice='时机与条件尚未成熟，强行推进恐生悔恨，宜守静待时、另寻他途。';}
  return {lv:lv,title:title,advice:advice,avg:avg,n:n};
}
function badge(r){return '<span class="badge '+(r==='吉'?'ji':r==='凶'?'xiong':'ping')+'">'+r+'</span>';}

/* ============ 渲染与交互 ============ */
var $=function(id){return document.getElementById(id);};
var current=null;

function renderYaoRows(throws){
  var col=$('yaoCol');col.innerHTML='';
  for(var i=0;i<6;i++){
    (function(idx){
      var t=throws[idx];
      var row=document.createElement('div');
      row.className='yao-row'+(t.moving?' moving':'');row.id='yaoRow'+idx;
      var segs=t.yang?'<div class="seg"></div>':'<div class="seg"></div><div class="seg"></div>';
      row.innerHTML='<span class="yao-name'+(t.moving?' mov':'')+'">'+YAO_POS[idx]+(t.yang?'九':'六')+'</span>'+
        '<div class="yao-bar">'+segs+'</div>'+
        '<span class="yao-mark">'+(t.moving?(t.yang?'○':'×'):'')+'</span>';
      col.appendChild(row);
    })(i);
  }
}

function delay(ms){return new Promise(function(r){setTimeout(r,ms);});}

function doCast(){
  var q=$('question').value.trim();
  if(!q){$('question').focus();alert('请先写下所占之事，一事一卦。');return;}
  var btn=$('castBtn');btn.disabled=true;btn.textContent='起卦中……';
  $('result').style.display='none';
  var stage=$('stage');stage.style.display='block';
  var coins=$('coins');coins.style.display='flex';
  $('stageHint').textContent='静心默念：「'+q+'」';
  var throws=castSix();
  renderYaoRows(throws);

  (async function(){
    await delay(400);
    for(var i=0;i<6;i++){
      Array.prototype.forEach.call(coins.children,function(c){
        c.classList.remove('spin');void c.offsetWidth;c.classList.add('spin');
      });
      $('stageHint').textContent='第 '+['一','二','三','四','五','六'][i]+' 爻……';
      await delay(430);
      $('yaoRow'+i).classList.add('show');
      await delay(160);
    }
    coins.style.display='none';
    $('stageHint').textContent='卦成。';
    await delay(300);
    showResult(q,throws);
    btn.disabled=false;btn.textContent='摇 卦 起 占';
  })();
}

function showResult(q,throws){
  var benYao=throws.map(function(t){return t.yang?1:0;});
  var bianYao=throws.map(function(t){return t.moving?(t.yang?0:1):(t.yang?1:0);});
  var ben=guaByYao(benYao), bian=guaByYao(bianYao);
  var movingIdx=[];throws.forEach(function(t,i){if(t.moving)movingIdx.push(i);});
  var v=judge(ben,bian,movingIdx,throws);

  $('benName').textContent='本卦 '+ben.name;
  $('bianName').textContent=bian.name;
  $('benTag').textContent=ben.meaning;
  $('bianTag').textContent='变卦 · '+bian.meaning;
  $('guaCi').textContent=ben.guaCi;
  $('guaBai').textContent=ben.guaBai;

  var ml=$('movingList');
  if(movingIdx.length===0){ml.innerHTML='<div class="txt" style="color:var(--ink3)">无动爻，六爻皆静，事态平稳，依本卦而断。</div>';}
  else{
    ml.innerHTML=movingIdx.map(function(i){
      var L=ben.lines[i];
      return '<div class="line-item"><span class="lt">'+L.t+'</span>'+badge(L.r)+
        '<span class="lb">'+L.b+'</span></div>';
    }).join('');
  }
  $('bianTxt').textContent = movingIdx.length
    ? bian.guaBai+'（'+bian.meaning+'）'
    : '六爻皆静，无变卦。事态平稳，以本卦《'+ben.name+'》断之。';

  $('verdictLv').textContent=v.lv;
  $('verdictLv').style.color = (v.lv==='凶'||v.lv==='偏凶') ? '#3c6b4a'
    : (v.lv==='平' ? '#6b5f4b' : '#a32d2d');
  $('verdictTitle').textContent=v.title;
  $('verdictBody').textContent=v.advice;
  var posTxt=movingIdx.length?movingIdx.map(function(i){return YAO_POS[i]+'爻';}).join('、'):'六爻安静';
  $('verdictBasis').innerHTML='依据：本卦《'+ben.name+'》（'+ben.rating+'）'+badge(ben.rating)+
    '，变卦《'+bian.name+'》（'+bian.rating+'）'+badge(bian.rating)+
    '；动爻 '+posTxt+' 共 '+v.n+' 个。综合权衡本卦、变卦与动爻吉凶，得此判断。';

  current={time:Date.now(),question:q,ben:ben.name,bian:bian.name,
    benRating:ben.rating,bianRating:bian.rating,lv:v.lv,
    guaBai:ben.guaBai,moving:movingIdx.map(function(i){return ben.lines[i].t+'｜'+ben.lines[i].b;}),
    bianTxt:bian.guaBai,title:v.title,advice:v.advice,
    yao:throws.map(function(t){return {yang:t.yang,moving:t.moving};})};
  saveHistory(current);
  $('result').style.display='block';
  $('result').scrollIntoView({behavior:'smooth',block:'start'});
}

/* ============ 历史记录 ============ */
var HKEY='liuyao_history_v1';
function loadHistory(){try{return JSON.parse(localStorage.getItem(HKEY)||'[]');}catch(e){return [];}}
function saveHistory(rec){var h=loadHistory();h.unshift(rec);
  try{localStorage.setItem(HKEY,JSON.stringify(h.slice(0,100)));}catch(e){}}
function fmtTime(t){var d=new Date(t);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+
    ' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function renderHistory(){
  var h=loadHistory(),box=$('histList');
  if(!h.length){box.innerHTML='<div class="empty">暂无占问记录</div>';return;}
  box.innerHTML=h.map(function(r,i){
    var mv=r.moving&&r.moving.length?r.moving.map(function(m){return '<div>'+m+'</div>';}).join(''):'<div>无动爻</div>';
    return '<div class="hitem" data-i="'+i+'">'+
      '<button class="hdel" data-del="'+i+'">删除</button>'+
      '<div class="hq">'+(r.question||'（未填所占之事）')+'</div>'+
      '<div class="hm">'+fmtTime(r.time)+' · '+r.ben+' ➜ '+r.bian+' · <span style="color:var(--cinnabar)">'+r.lv+'</span></div>'+
      '<div class="hd">卦辞：'+r.guaBai+'<br>动爻：<br>'+mv+
      '<br>变卦：'+r.bianTxt+'<br>断语：'+r.title+' '+r.advice+'</div></div>';
  }).join('');
}
$('histBtn').onclick=function(){renderHistory();$('histMask').classList.add('open');};
$('histClose').onclick=function(){$('histMask').classList.remove('open');};
$('histMask').onclick=function(e){if(e.target===this)this.classList.remove('open');};
$('histList').addEventListener('click',function(e){
  var d=e.target.getAttribute('data-del');
  if(d!==null){e.stopPropagation();var h=loadHistory();h.splice(+d,1);
    localStorage.setItem(HKEY,JSON.stringify(h));renderHistory();return;}
  var it=e.target.closest('.hitem');if(it)it.classList.toggle('open');
});
$('histClear').onclick=function(){
  if(confirm('确定清空全部历史记录？此操作不可恢复。')){
    localStorage.removeItem(HKEY);renderHistory();}
};
$('againBtn').onclick=function(){$('result').style.display='none';
  $('question').value='';$('question').focus();window.scrollTo({top:0,behavior:'smooth'});};
$('castBtn').onclick=doCast;
</script>
</body>
